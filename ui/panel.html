    function closeImageLightbox() {
      el.imageLightbox.hidden = true;
      el.imageLightboxImage.removeAttribute("src");
    }

    function showImageLightbox(src, alt = "图片预览") {
      if (!src) return;
      el.imageLightboxImage.src = src;
      el.imageLightboxImage.alt = alt;
      el.imageLightbox.hidden = false;
    }

    /**
     * 历史图片不主动抓：进了视口（或快进视口）才去取。
     *
     * 以前是渲染时直接 loadAttachmentImage——打开一条图多的老线程，
     * 所有历史图会同时开始下载、解码，画面就卡在那儿。现在交给观察器排队。
     * 不支持 IntersectionObserver 就直接取，不影响功能。
     */
    let attachmentObserver = null;
    function attachmentObserverFor() {
      if (attachmentObserver) return attachmentObserver;
      if (typeof IntersectionObserver !== "function") return null;
      attachmentObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          if (!entry.isIntersecting) continue;
          const node = entry.target;
          attachmentObserver.unobserve(node);
          void loadAttachmentImage(
            node,
            node.dataset.attachmentId,
            node.dataset.attachmentOwner,
            node.dataset.keepBottom === "1",
          );
        }
      }, { root: el.stream, rootMargin: "400px 0px" });
      return attachmentObserver;
    }

    /** 渲染图片消息时统一走这里：能观察就等进视口，不能就当场取。 */
    function mountAttachmentImage(node, attachmentId, owner, keepBottom = false) {
      node.dataset.attachmentId = String(attachmentId ?? "");
      node.dataset.attachmentOwner = String(owner ?? "");
      node.dataset.keepBottom = keepBottom ? "1" : "";
      const observer = attachmentObserverFor();
      if (!observer || !node.dataset.attachmentId) {
        void loadAttachmentImage(node, attachmentId, owner, keepBottom);
        return;
      }
      observer.observe(node);
    }

    async function loadAttachmentImage(imageNode, attachmentId, agentId, keepBottom = false) {
      if (!imageNode || !attachmentId || !agentId) return;
      try {
        const res = await hana.api.fetch(`attachment/${encodeURIComponent(agentId)}/${encodeURIComponent(attachmentId)}`, { method: "GET" });
        if (!res.ok) return;
        const blob = await res.blob();
        if (!blob.size) return;
        const url = URL.createObjectURL(blob);
        if (!imageNode.isConnected || current !== agentId) {
          URL.revokeObjectURL(url);
          return;
        }
        if (keepBottom) imageNode.addEventListener("load", () => {
          if (current === agentId) scrollDown();
        }, { once: true });
        imageNode.src = url;
      } catch { /* 历史图片读不到时保留占位，不影响文字聊天 */ }
    }

    function appendInlineImage(rendered, image) {
      if (!rendered?.bubble || !image?.data) return;
      const imageNode = document.createElement("img");
      imageNode.className = "message-image";
      imageNode.alt = image.name || "发送的图片";
      imageNode.src = image.data;
      imageNode.loading = "lazy";
      rendered.bubble.appendChild(document.createElement("br"));
      rendered.bubble.appendChild(imageNode);
    }

    async function send() {
      if (busy || !current) return;
      const agentId = current;
      const turnSeq = threadViewSeq;
      const text = el.input.value.trim();
      const image = pendingImage;
      const sticker = pendingSticker;
      if (!text && !image && !sticker) return;
      const inputVersion = inputRevision;
      let accepted = false;

      busy = true;
      el.send.disabled = true;
      el.imageButton.disabled = true;
      el.send.classList.add("is-sent");
      el.send.setAttribute("aria-label", "消息已送达");
      el.input.value = "";
      autosizeInput();

      const optimisticPieces = [];
      if (text) optimisticPieces.push(text);
      else if (image) optimisticPieces.push("[图片]");
      if (sticker) optimisticPieces.push(`${STICKER_PREFIX}${sticker.id}`);
      let renderedUser = null;
      const optimisticRows = [];
      for (const piece of optimisticPieces) {
        renderedUser = bubble("user", piece, null, new Date().toISOString());
        optimisticRows.push(renderedUser.row);
      }
      appendInlineImage(renderedUser, image);
      const { row, col } = renderedUser;
      // 先摆上「未读」：她发出去那一刻就是未读，读到后收起（后端落盘的那一笔）
      const tickEl = tick(col, "未读");
      setStatus("");
      scrollDown(true);

      try {
        const started = await api("POST", "turns", {
          agentId,
          text,
          ...(image ? { image: { name: image.name, mimeType: image.mimeType, data: image.data } } : {}),
          ...(sticker ? { stickerId: sticker.id } : {}),
          // 她在不在看只是告诉后端「要不要演实时那套」；对方手机在不在手里跟这个无关
          watching: document.visibilityState === "visible",
        });
        accepted = true;
        // 成功回包只清理本次仍挂在待发送区的那张图；若期间换过图，保留新图。
        if (pendingImage === image) clearPendingImage();
        if (pendingSticker === sticker) clearPendingSticker();
        const draft = pendingDrafts.get(agentId);
        if (!draft || draft.revision <= inputVersion) pendingDrafts.delete(agentId);
        // 消息一旦被后端接收，发送门立刻打开；伙伴的回复由轮询慢慢补进来。
        // 这样她可以在 ta 打字或排期时继续说，不需要等上一轮演完。
        if (current !== agentId || turnSeq !== threadViewSeq) return;
        if (started.messageId) {
          seenIds.add(started.messageId);
          tickNodes.set(started.messageId, tickEl);
          bindMessageActions(row, { id: started.messageId, role: "user", text, kind: sticker ? "sticker" : undefined });
        }
        // 后端只在「面对面（手机在手，包括打盹）」时才给回合；给了就演实时那套。
        // 没给（手机不在手，只排队）就什么都不演，回复由轮询慢慢补。
        if (started.turnId) void playLiveTurn(agentId, turnSeq, started, tickEl);
      } catch (error) {
        if (!accepted) {
          // 乐观气泡只在 POST 被接受后才有正式身份；失败时必须收掉，避免留下假未读。
          for (const optimisticRow of optimisticRows) optimisticRow.remove();
          // 只有 POST 没被接受，才把原话当作待发送草稿；后续轮询失败不能诱导重复发送。
          const edited = inputOwner === agentId && inputRevision !== inputVersion;
          const existing = pendingDrafts.get(agentId);
          if (!edited && (!existing || existing.revision <= inputVersion)) {
            pendingDrafts.set(agentId, { text, revision: inputVersion });
          }
          if (current === agentId && turnSeq === threadViewSeq && !edited) {
            el.input.value = text;
            autosizeInput();
            setStatus(`没送出去，原话给你留着：${error.message}`);
          }
        } else if (current === agentId && turnSeq === threadViewSeq) {
          setStatus(`消息已经送达，但回复状态暂时取不到：${error.message}`);
        }
      } finally {
        // 旧请求无论在哪个窗口结束，都要释放提交锁；但不能碰新窗口的按钮状态。
        busy = false;
        if (current !== agentId || turnSeq !== threadViewSeq) return;
        el.send.disabled = false;
        el.send.classList.remove("is-sent");
        el.send.setAttribute("aria-label", "发送");
        const partner = partners.find((item) => item.id === current);
        el.imageButton.disabled = !current || !(partner?.imageCapability?.allowed);
        el.input.focus();
      }
    }

    el.send.addEventListener("click", send);
    function clearImagePickFeedback() {
      el.imageButton.classList.remove("is-busy");
      el.imageButton.removeAttribute("aria-busy");
    }

    el.imageButton.addEventListener("click", () => {
      if (el.imageButton.disabled) return;
      el.imageButton.classList.add("is-busy");
      el.imageButton.setAttribute("aria-busy", "true");
      setStatus("正在打开图片选择…");
      el.imageFile.click();
    });
    el.imageFile.addEventListener("cancel", () => {
      clearImagePickFeedback();
      setStatus("");
    });
    async function chooseImageFile(file) {
      if (!file) {
        clearImagePickFeedback();
        setStatus("");
        return;
      }
      if (busy) {
        clearImagePickFeedback();
        return setStatus("上一张图片还在发送，请稍候");
      }
      el.imageButton.classList.add("is-busy");
      el.imageButton.setAttribute("aria-busy", "true");
      setStatus("正在读取图片…");
      if (!current) return setStatus("先选一位伙伴");
      if (file.size > 10 * 1024 * 1024) return setStatus("图片太大了，单张上限 10MB");
      const owner = current;
      const choice = ++imageChoiceSeq;
      try {
        const data = await readImageFile(file);
        if (current !== owner || choice !== imageChoiceSeq) return;
        pendingImage = { name: file.name || "剪贴板图片.png", mimeType: file.type, data };
        renderPendingImage();
        clearImagePickFeedback();
        setStatus("图片已放好，按发送交给 ta");
      } catch (error) {
        if (current === owner && choice === imageChoiceSeq) {
          clearPendingImage();
          clearImagePickFeedback();
          setStatus(error.message || "图片没读出来");
        }
      }
    }
    el.imageFile.addEventListener("change", () => {
      const file = el.imageFile.files?.[0];
      el.imageFile.value = "";
      void chooseImageFile(file);
    });
    el.input.addEventListener("paste", (event) => {
      const item = Array.from(event.clipboardData?.items || []).find((entry) => entry.kind === "file" && entry.type.startsWith("image/"));
      const file = item?.getAsFile();
      if (!file) return;
      event.preventDefault();
      void chooseImageFile(file);
    });
    el.pendingImageView.addEventListener("click", () => showImageLightbox(pendingImage?.data, pendingImage?.name || "待发送图片"));
    el.pendingImageRemove.addEventListener("click", () => {
      clearPendingImage();
      setStatus("已取消这张图片");
    });
    el.pendingStickerRemove.addEventListener("click", () => {
      clearPendingSticker();
      setStatus("已取消这张表情包");
    });
    el.imageLightboxClose.addEventListener("click", closeImageLightbox);
    el.imageLightbox.addEventListener("click", (event) => {
      if (event.target === el.imageLightbox) closeImageLightbox();
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !el.imageLightbox.hidden) closeImageLightbox();
    });
    el.chatAvatar.addEventListener("dblclick", () => void doAction(current));
    // 双击是鼠标语言，键盘也得能用同一个动作（回车/空格）
    el.chatAvatar.tabIndex = 0;
    el.chatAvatar.setAttribute("role", "button");
    el.chatAvatar.setAttribute("aria-label", "戳一下");
    el.chatAvatar.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        void doAction(current);
      }
    });
    el.input.addEventListener("keydown", (event) => {
      // 中文输入法敲回车是在选字，不能当成发送（设置页那一屏一直这么写，这里以前漏了）。
      if (event.key !== "Enter" || event.shiftKey || event.isComposing || event.keyCode === 229) return;
      event.preventDefault();
      send();
    });
    el.input.addEventListener("input", () => {
      inputOwner = current;
      inputRevision += 1;
      const draft = pendingDrafts.get(inputOwner);
      if (draft && el.input.value.trim() !== draft.text) pendingDrafts.delete(inputOwner);
      autosizeInput();
    });
    // ──────────────────────── 认识 ta ────────────────────────
    //
    // 装完第一次进来，还没完成初步认识的伙伴不能开始聊——性格是这应用的魂，得先一起聊一遍。
    // 模型出的只是草稿（色 + 一批行为候选），挑哪些、叫什么名，人来定。

    const obEl = {
      root: document.getElementById("ob"),
      title: document.getElementById("ob-title"),
      sub: document.getElementById("ob-sub"),
      body: document.getElementById("ob-body"),
      step: document.getElementById("ob-step"),
      back: document.getElementById("ob-back"),
      next: document.getElementById("ob-next"),
    };

    const ROLE_TEXT = { base: "底色", main: "主色调", accent: "点缀" };
    const ROLE_HINT = {
      base: "始终在的那层，但不一定最显眼",
      main: "平时最突出的那一面",
      accent: "特定时候才露出来的",
    };
    const OB_MAX_PICK = 3;

    let obQueue = [];
    let obPending = null;
    let obState = null;
    let obStage = 1;

    function obNode(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }

    /** 还没完成初步认识的伙伴。返回 {pending, firstRun}；都完成了返回 null。读不出来也不拦。 */
    async function onboardingPending() {
      try {
        const data = await api("GET", "onboarding");
        const pending = data?.pending ?? [];
        if (!pending.length) return null;
        const total = Number(data?.total ?? pending.length);
        // 一个都没完成初步认识（新装）→ 必须过队列；已经完成过的→不拦，别老用户一开就卡住
        return { pending, firstRun: total > 0 && pending.length >= total };
      } catch {
        return null;
      }
    }

    function emptyObState() {
      return {
        partner: null,
        colors: [],
        picked: new Map(),
        ready: false,
        running: false,
        loadingDraft: false,
        error: null,
        warn: null,
        steps: [],
        progress: null,
        portrait: [],
        modeChoice: false,
        mode: "quick",
        questions: [],
        recognition: null,
        recognitionIndex: 0,
        recognitionDraft: null,
        recognitionDrafts: {},
        recognitionSuggesting: false,
        recognitionSuggestSeq: 0,
        recognitionSaving: false,
        recognitionSaveSeq: 0,
        recognitionDraftSaveTimer: null,
        recognitionDraftSavePromise: null,
        recognitionSuggestions: [],
        recognitionSuggestionError: "",
        recognitionPrompt: "",
        localName: "",
        localDescription: "",
      };
    }

    /** 把层显出来。obBegin 和 obPick 都得走这儿——少一处就会出现「点了没反应」。 */
    function obOpen() {
      obEl.root.hidden = false;
      document.body.classList.add("ob-open");
    }

    /** 关掉认识层。进主界面之前必须走一步——不然层盖在上面，什么点了都"没反应"。 */
    function obClose() {
      obEl.root.hidden = true;
      document.body.classList.remove("ob-open");
      obState = null;
    }

    async function obCreateLocal() {
      const name = String(obState.localName ?? "").trim();
      if (!name) {
        obEl.sub.textContent = "先给这位角色取个名字";
        return;
      }
      obEl.next.disabled = true;
      obEl.next.textContent = "存着…";
      try {
        const data = await api("POST", "local-partners", {
          name,
          description: obState.localDescription,
        });
        await loadPartners();
        const partner = data.partner;
        obQueue = [partner, ...obQueue.filter((row) => row.id !== partner.id)];
        obState = { ...emptyObState(), partner, modeChoice: true };
        obRender();
      } catch (error) {
        obEl.sub.textContent = `没存上：${error.message}`;
        obEl.next.disabled = false;
        obEl.next.textContent = "创建角色";
      }
    }

    /** 认真认识 ta：选项只是抓手，修改和自由输入原样保存。 */
    async function obStartRecognition(partner, options = {}) {
      obOpen();
      obEl.body.replaceChildren();
      obEl.title.textContent = `正在打开和「${partner.name}」的认识流程…`;
      obEl.sub.textContent = options.restart
        ? "从头再来一遍，之前答的已经清掉了。"
        : "把之前留下的回答接着看，也可以回头修改。";
      try {
        // 「重新认识」= 从头再做一遍：先把还在防抖里等着的旧草稿掉，再清空，
        // 不然那笔草稿会在清空之后再写回来。
        if (options.restart) {
          if (obState) {
            clearTimeout(obState.recognitionDraftSaveTimer);
            obState.recognitionDraftSaveTimer = null;
          }
          await api("POST", `recognition/${encodeURIComponent(partner.id)}/restart`);
        }
        const data = await api("GET", `recognition/${encodeURIComponent(partner.id)}`);
        const questions = data?.questions ?? [];
        const recognition = data?.recognition ?? { answers: {}, current: questions[0]?.id ?? null };
        const savedIndex = questions.findIndex((question) => question.id === recognition.current);
        const draftIndex = questions.findIndex((question) => recognition.answers?.[question.id]?.draft === true);
        const firstUnanswered = questions.findIndex((question) => !recognition.answers?.[question.id]);
        // 兼容旧版本：没有草稿标记时，current 若仍停在已回答的早期题，优先接第一道未完成题。
        const legacyResumeIndex = savedIndex >= 0 && !recognition.answers?.[questions[savedIndex]?.id]?.draft
          && firstUnanswered > savedIndex ? firstUnanswered : savedIndex;
        const index = draftIndex >= 0 ? draftIndex : legacyResumeIndex >= 0 ? legacyResumeIndex : firstUnanswered >= 0 ? firstUnanswered : 0;
        obState = {
          ...emptyObState(),
          partner,
          mode: "recognition",
          questions,
          recognition,
          recognitionIndex: index < 0 ? 0 : index,
        };
        obRender();
      } catch (error) {
        obState = { ...emptyObState(), partner, modeChoice: true, error: `认识流程没打开：${error.message}` };
        obRender();
      }
    }

    function obChooseMode(mode) {
      const partner = obState?.partner;
      if (!partner) return;
      obState.modeChoice = false;
      if (mode === "recognition") {
        void obStartRecognition(partner);
      } else {
        void obStartFor(partner);
      }
    }

    /** 打开快速认识。第零步是挑人——不自动跑，用户想先认识谁就选谁。 */
    async function obBegin() {
      obState = emptyObState();
      obStage = 0;
      obOpen();
      obRender();
      return true;
    }

    /** 从伙伴清单点进来的正门：先让她选轻量认识还是认真认识。 */
    async function obPick(partner) {
      obState = { ...emptyObState(), partner, modeChoice: true };
      obOpen();
      obRender();
    }

    /** 选定一位，开跑。 */
    async function obStartFor(partner, options = {}) {
      const reshape = Boolean(options.reshape);
      obOpen();
      obQueue = reshape ? [partner] : [partner, ...obQueue.filter((row) => row.id !== partner.id)];
      // 一进来就锁住：草稿还没到之前，「下一步」不能点（不然能一路点到交空数据）
      obState = { ...emptyObState(), partner, reshape, running: true, loadingDraft: true };
      obStage = 1;
      obRender();
      await obLoadDraft(partner, { force: Boolean(options.force) });
    }

    async function obLoadDraft(partner, { force = false } = {}) {
      const agentId = partner.id;
      if (!force) try {
        const cached = await api("POST", "onboarding/draft", { agentId, peek: true });
        if (cached?.draft?.colors?.length) {
          obApplyDraft(cached.draft);
          return;
        }
      } catch {
        /* 没有现成的就现跑 */
      }
      obState.running = true;
      obRender();
      let started = null;
      try {
        started = await api("POST", "onboarding/draft", { agentId, force });
      } catch (error) {
        obState.running = false;
        obState.loadingDraft = false;
        obState.error = `跑不起来：${error.message}`;
        obRender();
        return;
      }
      // 启动那次回包就带着步骤表，接住它，别让进度页先空一轮
      if (Array.isArray(started?.steps) && started.steps.length) obState.steps = started.steps;

      // 按总时间收，不按次数。每轮请求自己可能等好几秒，按次数算实际能拖成半小时。
      const deadline = Date.now() + 8 * 60 * 1000;
      let miss = 0;
      while (Date.now() < deadline) {
        await sleep(1500);
        try {
          const now = await api("POST", "onboarding/draft", { agentId, peek: true });
          miss = 0;
          if (obState.warn) {
            obState.warn = null;
            obRender();
          }
          const draft = now?.draft;
          if (draft?.colors?.length) {
            obApplyDraft(draft);
            return;
          }
          if (draft?.error) {
            obState.running = false;
            obState.loadingDraft = false;
            obState.error = `跑挂了：${draft.error.message || "不知道为啥"}`;
            obRender();
            return;
          }
          if (Array.isArray(now?.steps) && now.steps.length) obState.steps = now.steps;
          const next = now?.progress ?? null;
          const moved = (next?.step ?? -1) !== (obState.progress?.step ?? -1);
          obState.progress = next;
          obState.lastPing = Date.now();
          if (moved) obRender();
          else obRenderClock();
        } catch {
          // 网络不顺不能装没事：连错三次就明说，别只让进度条停着
          miss += 1;
          if (miss >= 3 && !obState.warn) {
            obState.warn = "连接好像不太顺，还在重试…";
            obRender();
          }
        }
      }
      obState.running = false;
      obState.loadingDraft = false;
      obState.error = "等了八分钟还没出来。可能是模型这会儿慢，也可能是还没配置能用的文字模型，去 Hana 设置里确认一下再试。";
      obRender();
    }

    function obApplyDraft(draft) {
      obState.colors = (draft.colors ?? []).map((color) => {
        const rows = (color.rows ?? []).map((row) => ({ id: row.id, text: row.text }));
        return {
          id: color.id,
          name: color.name,
          role: color.role,
          alternatives: color.alternatives ?? [],
          rows,
          // 默认先勾前两条：不想细看的人点两下就过，想细调的人再动
          picked: new Set(rows.slice(0, 2).map((row) => row.id)),
        };
      });
      obState.portrait = (draft.portrait ?? []).map((row) => ({ title: row.title, text: row.text }));
      obState.running = false;
      obState.loadingDraft = false;
      obState.warn = null;
      obState.error = null;
      obState.ready = true;
      obState.error = null;
      obRender();
    }

    /** 只刷「上次更新」那一行，不整屏重绘——重绘会打断正在看的人。 */
    function obRenderClock() {
      if (!obEl.clock) return;
      const at = obState?.lastPing;
      obEl.clock.textContent = at
        ? `上次更新：${Math.max(0, Math.round((Date.now() - at) / 1000))} 秒前`
        : "还没收到第一份进度";
    }

    function obRender() {
      if (!obState) return;
      obEl.body.replaceChildren();

      if (obState.mode === "local-create") {
        obEl.title.textContent = "新增茶话会角色";
        obEl.sub.textContent = "这位角色只存在于茶话会，不会写进 Hana。";
        obEl.step.textContent = "茶话会自己的角色";
        obEl.back.hidden = false;
        obEl.back.textContent = "先回去聊";
        obEl.next.hidden = false;
        obEl.next.disabled = false;
        obEl.next.textContent = "创建角色";
        const name = document.createElement("input");
        name.className = "ob-name ob-local-input";
        name.maxLength = 40;
        name.placeholder = "角色名字";
        name.value = obState.localName;
        name.addEventListener("input", () => { obState.localName = name.value; });
        obEl.body.appendChild(name);
        const description = document.createElement("textarea");
        description.className = "ob-portrait-text ob-rec-input";
        description.rows = 5;
        description.maxLength = 4000;
        description.placeholder = "可以先写几句：ta是谁、你想怎么认识 ta（可留空，之后走认真认识）";
        description.value = obState.localDescription;
        description.addEventListener("input", () => { obState.localDescription = description.value; });
        obEl.body.appendChild(description);
        return;
      }

      if (obState.modeChoice) {
        obEl.title.textContent = `先和「${obState.partner.name}」认识一下`;
        obEl.sub.textContent = "想快一点，还是坐下来认真聊一遍？之后两条路还能接着补。";
        obEl.step.textContent = "选择认识方式";
        obEl.back.hidden = false;
        obEl.back.textContent = "先回去聊";
        obEl.next.hidden = true;
        if (obState.error) obEl.body.appendChild(obNode("p", "ob-warn", obState.error));
        const quick = obNode("button", "ob-pick", "先聊个大概");
        quick.type = "button";
        quick.addEventListener("click", () => obChooseMode("quick"));
        const deep = obNode("button", "ob-pick", "认真认识 ta");
        deep.type = "button";
        deep.addEventListener("click", () => obChooseMode("recognition"));
        obEl.body.append(quick, deep);
        return;
      }

      if (obState.mode === "recognition") {
        obRenderRecognition();
        return;
      }
      if (obState.mode === "recognition-done") {
        obRenderRecognitionDone();
        return;
      }

      // 第零步：挑人。不自动跑——用户想先认识谁，就选谁。
      if (obStage === 0) {
        obEl.title.textContent = "先挑一位，认识一下";
        obEl.sub.textContent = "伙伴得一个一个来。想先认识谁，点了 ta 就开始。";
        obEl.step.textContent = `还有 ${obQueue.length} 位没认识`;
        obEl.back.hidden = true;
        obEl.next.hidden = true;
        for (const partner of obQueue) {
          const pick = obNode("button", "ob-pick", partner.name);
          pick.type = "button";
          pick.addEventListener("click", () => void obPick(partner));
          obEl.body.appendChild(pick);
        }
        const add = obNode("button", "ob-pick", "＋ 新增角色");
        add.type = "button";
        add.addEventListener("click", () => {
          obState = { ...emptyObState(), mode: "local-create" };
          obRender();
        });
        obEl.body.appendChild(add);
        return;
      }

      obEl.title.textContent = obState.reshape
        ? `重新整理「${obState.partner.name}」的性格`
        : `和「${obState.partner.name}」认识一下`;

      if (obState.running) {
        const steps = obState.steps ?? [];
        const at = obState.progress?.step ?? -1;
        obEl.sub.textContent = at >= 0 && steps[at]
          ? `正在：${steps[at].label}`
          : "模型正在翻它的材料，先认识一下 ta……";
        obEl.step.textContent = steps.length ? `第 ${at + 1} / ${steps.length} 步` : "";
        obEl.back.hidden = false;
        obEl.back.textContent = "先回去聊";
        obEl.next.hidden = true;
        if (steps.length) {
          const list = obNode("ol", "ob-steps");
          for (let i = 0; i < steps.length; i += 1) {
            const item = obNode("li", i === at ? "on" : i < at ? "done" : "");
            item.appendChild(obNode("span", "ob-step-name", steps[i].label));
            item.appendChild(obNode("span", "ob-step-note", steps[i].note));
            list.appendChild(item);
          }
          obEl.body.appendChild(list);
        }
        obEl.body.appendChild(
          obNode("p", "ob-wait", "整个过程三五分钟。这页会跟着它走到哪一步——一直不动，就是真有问题。"),
        );
        if (obState.warn) obEl.body.appendChild(obNode("p", "ob-warn", obState.warn));
        obEl.clock = obNode("p", "ob-clock", "");
        obEl.body.appendChild(obEl.clock);
        obRenderClock();
        return;
      }
      if (obState.error) {
        obEl.sub.textContent = obState.error;
        obEl.step.textContent = "";
        obEl.back.hidden = true;
        obEl.next.hidden = false;
        obEl.next.disabled = false;
        obEl.next.textContent = "再试一次";
        return;
      }

      // 认识完一个、队列里还有人：问一句接着认识还是先去聊
      if (obStage === 5) {
        obEl.sub.textContent = "这一个认识好了。";
        obEl.step.textContent = `还有 ${obQueue.length} 位没认识`;
        obEl.back.hidden = false;
        obEl.back.textContent = "先去聊";
        obEl.next.hidden = false;
        obEl.next.disabled = false;
        obEl.next.textContent = "继续认识";
        obEl.body.appendChild(obNode("p", "ob-wait", "还没完成初步认识的伙伴进不了聊天窗——这是故意的，性格得你自己过一道手。剩下的可以现在继续认识，也可以以后再说。"));
        return;
      }

      obEl.back.textContent = "上一步";

      obEl.next.hidden = false;
      obEl.next.disabled = false;
      obEl.step.textContent = `第 ${obStage} / 4 步`;
      obEl.back.hidden = obStage <= 1 || obStage >= 5;
      obEl.next.textContent = obStage >= 4 ? "就这么定" : "下一步";
      obEl.sub.textContent = obStage === 1
        ? "这是模型从 ta 的材料里理出来的几个色。名字不顺眼就改。答过的会一直留着，中途退出去也丢不了。"
        : obStage === 2
          ? "每个色底下给了一批行为候选，挑你觉得像 ta 的（最多三条）。"
          : obStage === 3
            ? "模型先猜了一版「它是怎样一个人」。说反了就改，说漏了就补，改完的才算你的。"
            : "看一眼。定了以后还能改，别紧张。";

      if (obStage === 1) obRenderColors();
      else if (obStage === 2) obRenderRows();
      else if (obStage === 3) obRenderPortrait();
      else obRenderSummary();
    }

    function obColorHead(color) {
      const head = obNode("div", "ob-color-head");
      head.appendChild(obNode("span", `ob-role ${color.role}`, ROLE_TEXT[color.role] ?? "色"));
      return head;
    }

    function obRenderColors() {
      for (const color of obState.colors) {
        const card = obNode("div", "ob-color");
        const head = obColorHead(color);
        const input = document.createElement("input");
        input.className = "ob-name";
        input.value = color.name;
        input.maxLength = 8;
        input.setAttribute("aria-label", "色名");
        input.addEventListener("input", () => {
          color.name = input.value.trim();
        });
        head.appendChild(input);
        card.appendChild(head);
        card.appendChild(obNode("p", "ob-hint", ROLE_HINT[color.role] ?? ""));
        if (color.alternatives.length) {
          const alts = obNode("div", "ob-alts");
          alts.appendChild(obNode("span", "ob-alts-label", "或者："));
          for (const name of color.alternatives) {
            const chip = obNode("button", "ob-chip", name);
            chip.type = "button";
            chip.addEventListener("click", () => {
              color.name = name;
              input.value = name;
            });
            alts.appendChild(chip);
          }
          card.appendChild(alts);
        }
        obEl.body.appendChild(card);
      }
    }

    function obRenderRows() {
      for (const color of obState.colors) {
        const card = obNode("div", "ob-color");
        const head = obColorHead(color);
        head.appendChild(obNode("strong", "ob-color-name", color.name));
        head.appendChild(obNode("span", "ob-count", `${color.picked.size} / ${OB_MAX_PICK}`));
        card.appendChild(head);
        for (const row of color.rows) {
          const on = color.picked.has(row.id);
          const item = obNode("button", `ob-row${on ? " on" : ""}`);
          item.type = "button";
          item.appendChild(obNode("span", "ob-tick", on ? "✓" : ""));
          item.appendChild(obNode("span", "ob-row-text", row.text));
          item.addEventListener("click", () => {
            if (color.picked.has(row.id)) color.picked.delete(row.id);
            else if (color.picked.size < OB_MAX_PICK) color.picked.add(row.id);
            obRender();
          });
          card.appendChild(item);
        }
        obEl.body.appendChild(card);
      }
    }

    function obRenderPortrait() {
      const rows = obState.portrait ?? [];
      obEl.body.appendChild(
        obNode(
          "p",
          "ob-tip",
          "下面这几段是模型猜的「在它眼里，你是怎么看你自己的」。说反了就改，说漏了就补；改完的才算你的。",
        ),
      );
      if (!rows.length) {
        obEl.body.appendChild(obNode("p", "ob-wait", "这一版没写出来。跳过也行，以后还能自己补。"));
        return;
      }
      rows.forEach((row, index) => {
        const box = obNode("div", "ob-portrait");
        box.appendChild(obNode("span", "ob-portrait-title", row.title));
        const area = document.createElement("textarea");
        area.className = "ob-portrait-text";
        area.rows = 6;
        area.value = row.text;
        area.addEventListener("input", () => {
          rows[index].text = area.value;
        });
        box.appendChild(area);
        obEl.body.appendChild(box);
      });
    }

    function obRenderSummary() {
      for (const color of obState.colors) {
        const card = obNode("div", "ob-color");
        const head = obColorHead(color);
        head.appendChild(obNode("strong", "ob-color-name", color.name));
        card.appendChild(head);
        for (const row of color.rows) {
          if (!color.picked.has(row.id)) continue;
          card.appendChild(obNode("p", "ob-final", row.text));
        }
        obEl.body.appendChild(card);
      }
    }

    function obScheduleRecognitionDraft() {
      const stateRef = obState;
      if (!stateRef?.recognitionDraft?.questionId || !stateRef.partner?.id) return;
      clearTimeout(stateRef.recognitionDraftSaveTimer);
      stateRef.recognitionDraftSaveTimer = setTimeout(() => {
        stateRef.recognitionDraftSaveTimer = null;
        const draft = stateRef.recognitionDraft;
        // 空白草稿不发：那会把已经认识好的档案打回「没做完」，旧答案也会被删掉。
        const filled = (Array.isArray(draft.selected) && draft.selected.length)
          || String(draft.note ?? "").trim()
          || String(draft.text ?? "").trim()
          || (Array.isArray(draft.scenarios) && draft.scenarios.length);
        if (!filled) return;
        const payload = {
          questionId: draft.questionId,
          selected: [...(draft.selected ?? [])],
          note: draft.note ?? "",
          text: draft.text ?? "",
          scenarios: [...(draft.scenarios ?? [])],
          draft: true,
        };
        const pending = api("POST", `recognition/${encodeURIComponent(stateRef.partner.id)}/answer`, payload).catch(() => null);
        stateRef.recognitionDraftSavePromise = pending;
        // 只清自己那一笔：旧请求完成时不能把还在飞的新请求标记抹掉。
        pending.finally(() => {
          if (stateRef.recognitionDraftSavePromise === pending) stateRef.recognitionDraftSavePromise = null;
        });
      }, 250);
    }

    async function obFlushRecognitionDraft(stateRef, draft) {
      clearTimeout(stateRef.recognitionDraftSaveTimer);
      stateRef.recognitionDraftSaveTimer = null;
      if (stateRef.recognitionDraftSavePromise) await stateRef.recognitionDraftSavePromise;
      if (obState !== stateRef || !stateRef.partner?.id) return;
      const payload = {
        questionId: draft.questionId,
        selected: [...(draft.selected ?? [])],
        note: draft.note ?? "",
        text: draft.text ?? "",
        scenarios: [...(draft.scenarios ?? [])],
        draft: true,
      };
      stateRef.recognitionDraftSavePromise = api("POST", `recognition/${encodeURIComponent(stateRef.partner.id)}/answer`, payload)
        .catch(() => null);
      await stateRef.recognitionDraftSavePromise;
      stateRef.recognitionDraftSavePromise = null;
    }

    function obRenderRecognition() {
      const questions = obState.questions ?? [];
      const question = questions[obState.recognitionIndex];
      if (!question) {
        obState.mode = "recognition-done";
        obRender();
        return;
      }
      const answer = obState.recognition?.answers?.[question.id] ?? {};
      const savedDraft = obState.recognitionDrafts?.[question.id];
      const draft = obState.recognitionDraft?.questionId === question.id
        ? obState.recognitionDraft
        : savedDraft ?? {
          questionId: question.id,
          selected: [...(answer.selected ?? [])],
          note: answer.note ?? "",
          text: answer.text ?? "",
          scenarios: Array.isArray(answer.scenarios)
            ? answer.scenarios.map((item) => ({ ...item }))
            : answer.scenario ? [{ ...answer.scenario }] : [],
          origin: answer.origin === "scenario" ? "scenario" : "user",
        };
      obState.recognitionDraft = draft;
      obEl.title.textContent = `认真认识「${obState.partner.name}」`;
      obEl.sub.textContent = question.title;
      obEl.step.textContent = `第 ${obState.recognitionIndex + 1} / ${questions.length} 题`;
      obEl.back.hidden = false;
      obEl.back.disabled = Boolean(obState.recognitionSaving);
      obEl.back.textContent = obState.recognitionIndex <= 0 ? "先回去聊" : "上一题";
      obEl.next.hidden = false;
      obEl.next.disabled = Boolean(obState.recognitionSaving);
      obEl.next.textContent = obState.recognitionIndex === questions.length - 1 ? "认识好了" : "收下这句";
      obEl.body.appendChild(obNode("p", "ob-tip", question.hint));

      const options = obNode("div", "ob-rec-options");
      for (const option of question.options ?? []) {
        const on = draft.selected.includes(option.id);
        const item = obNode("button", `ob-row${on ? " on" : ""}`);
        item.type = "button";
        item.appendChild(obNode("span", "ob-tick", on ? "✓" : ""));
        item.appendChild(obNode("span", "ob-row-text", option.text));
        item.addEventListener("click", () => {
          // 挑最像的：到顶之后新选的把最早那条挤出去，不让「全都像」。
          const limit = Number(question.maxSelect) > 0 ? Number(question.maxSelect) : 0;
          let next = on
            ? draft.selected.filter((id) => id !== option.id)
            : [...draft.selected, option.id];
          if (!on && limit > 0 && next.length > limit) next = next.slice(next.length - limit);
          draft.selected = next;
          obScheduleRecognitionDraft();
          obRender();
        });
        options.appendChild(item);
      }
      obEl.body.appendChild(options);
      const selectLimit = Number(question.maxSelect) > 0 ? Number(question.maxSelect) : 0;
      if (selectLimit > 0) {
        const picked = (draft.selected ?? []).length;
        obEl.body.appendChild(obNode("p", "ob-rec-count",
          picked >= selectLimit
            ? `已经挑满 ${selectLimit} 个了，再选会顶掉最早那个。`
            : `挑最像的，最多 ${selectLimit} 个（已选 ${picked} 个）。`));
      }

      obEl.body.appendChild(obNode("strong", "ob-custom-title", "写一点只属于 ta 的东西"));
      obEl.body.appendChild(obNode("p", "ob-custom-hint", question.id === "boundaries"
        ? "这一题选的是 ta 不能做的事。可以补充一个具体禁区，或写清楚什么行为会让你觉得越界。"
        : question.intent === "avoid"
          ? "这一题选的是你最不希望 ta 被演成的样子。可以补一句具体的话，或写清楚哪种反应一出来你就觉得「这不是 ta」。"
          : "选项只是起点。可以写一件小事、一次对话，或者让 ta 在某种情况下表现出来的反应。"));

      const suggest = obNode("button", "ob-suggest", obState.recognitionSuggesting ? "正在生成几个场景…" : "给我几个具体场景");
      suggest.type = "button";
      suggest.disabled = obState.recognitionSuggesting;
      suggest.setAttribute("aria-busy", obState.recognitionSuggesting ? "true" : "false");
      suggest.addEventListener("click", () => void obSuggestRecognition(question));
      obEl.body.appendChild(suggest);
      if (obState.recognitionSuggestionError) {
        obEl.body.appendChild(obNode("p", "ob-warn", obState.recognitionSuggestionError));
      }
      if (obState.recognitionSuggestions.length) {
        const suggestions = obNode("div", "ob-suggestions");
        suggestions.appendChild(obNode("div", "ob-suggestions-label", "下面是设想的情境，不是真实经历过的事。一个场景挑一条就行，挑最像的："));
        for (const candidate of obState.recognitionSuggestions) {
          const card = obNode("div", "ob-suggestion");
          card.appendChild(obNode("div", "ob-suggestion-scene", candidate.scene));
          const reactions = candidate.reactions?.length ? candidate.reactions : [candidate.scene];
          for (const reaction of reactions) {
            const selected = (obState.recognitionDraft?.scenarios ?? []).some((item) =>
              item.scene === candidate.scene && item.reaction === reaction,
            );
            const item = obNode("button", `ob-suggestion-reaction${selected ? " is-selected" : ""}`, reaction);
            item.type = "button";
            item.setAttribute("aria-pressed", selected ? "true" : "false");
            item.addEventListener("click", () => {
              obState.recognitionPrompt = question.intent === "avoid"
                ? `场景：${candidate.scene}\n不要出现：${reaction}`
                : `场景：${candidate.scene}\nta的反应：${reaction}`;
              const scenarios = obState.recognitionDraft.scenarios ?? [];
              const existing = scenarios.findIndex((item) => item.scene === candidate.scene && item.reaction === reaction);
              let notice = "";
              if (existing >= 0) {
                // 再点一下就取消。
                scenarios.splice(existing, 1);
              } else {
                // 一个场景只留一条：同场景两条不同反应，模型会不知道该听哪条。
                // 不默默丢掉她之前点的那条，直接换成新的，并且说一声。
                const sameScene = scenarios.findIndex((item) => item.scene === candidate.scene);
                if (sameScene >= 0) {
                  scenarios[sameScene] = { scene: candidate.scene, reaction };
                  notice = "这个场景已经有一条了，帮你换成了这条。";
                } else if (scenarios.length >= 6) {
                  notice = "方向最多留六个，先去掉一个再加吧。";
                } else {
                  scenarios.push({ scene: candidate.scene, reaction });
                }
              }
              obState.recognitionDraft.scenarios = scenarios;
              obState.recognitionDraft.origin = scenarios.length ? "scenario" : "user";
              // 超限的提示得留住；只有真加上/取消了才把上次的提示清掉。
              obState.recognitionSuggestionError = notice;
              obScheduleRecognitionDraft();
              obRender();
            });
            card.appendChild(item);
          }
          suggestions.appendChild(card);
        }
        obEl.body.appendChild(suggestions);
      }
      const chosenScenarios = obState.recognitionDraft?.scenarios ?? [];
      if (chosenScenarios.length) {
        const avoidPicked = question.intent === "avoid";
        obState.recognitionPrompt = chosenScenarios
          .map((item) => (avoidPicked
            ? `场景：${item.scene}\n不要出现：${item.reaction}`
            : `场景：${item.scene}\nta的反应：${item.reaction}`))
          .join("\n\n");
        obEl.body.appendChild(obNode("p", "ob-writing-prompt", `已选 ${chosenScenarios.length} 个${avoidPicked ? "要避开的方向" : "创作方向"}：${obState.recognitionPrompt}`));
      }

      const text = document.createElement("textarea");
      text.className = "ob-portrait-text ob-rec-input";
      text.rows = 4;
      text.maxLength = 1200;
      text.placeholder = question.id === "speech"
        ? "要是想起 ta 平时怎么发消息，原样贴一两句进来（照抄最好，别改成书面语）；也可以留空…"
        : "可以补充一点自己的话，也可以留空…";
      text.value = [draft.note, draft.text].filter((value) => String(value ?? "").trim()).join("\n");
      text.addEventListener("input", () => {
        draft.note = "";
        draft.text = text.value;
        draft.origin = "user";
        obScheduleRecognitionDraft();
      });
      obEl.body.appendChild(text);
    }

    async function obSuggestRecognition(question) {
      if (!obState || obState.recognitionSuggesting) return;
      const stateRef = obState;
      const partnerId = obState.partner?.id;
      const index = obState.recognitionIndex;
      const requestSeq = ++obState.recognitionSuggestSeq;
      obState.recognitionSuggesting = true;
      obState.recognitionSuggestionError = "";
      obState.recognitionSuggestions = [];
      obRender();
      try {
        const result = await api("POST", `recognition/${encodeURIComponent(partnerId)}/suggestions`, {
          questionId: question.id,
          draft: {
            selected: [...(obState.recognitionDraft?.selected ?? [])],
            note: obState.recognitionDraft?.note ?? "",
            text: obState.recognitionDraft?.text ?? "",
            scenarios: [...(obState.recognitionDraft?.scenarios ?? [])],
          },
        });
        if (obState !== stateRef || obState.partner?.id !== partnerId || obState.recognitionIndex !== index || obState.recognitionSuggestSeq !== requestSeq) return;
        obState.recognitionSuggestions = Array.isArray(result.suggestions) ? result.suggestions : [];
        if (!obState.recognitionSuggestions.length) obState.recognitionSuggestionError = "这次没想出合适的方向，再试一次嘛";
      } catch (error) {
        if (obState !== stateRef || obState.partner?.id !== partnerId || obState.recognitionIndex !== index || obState.recognitionSuggestSeq !== requestSeq) return;
        obState.recognitionSuggestionError = `没拿到建议：${error.message}`;
      } finally {
        if (obState === stateRef && obState.partner?.id === partnerId && obState.recognitionIndex === index && obState.recognitionSuggestSeq === requestSeq) {
          obState.recognitionSuggesting = false;
          obRender();
        }
      }
    }

    async function obRecognitionNext() {
      if (!obState || obState.recognitionSaving) return;
      const stateRef = obState;
      const question = obState.questions[obState.recognitionIndex];
      const index = obState.recognitionIndex;
      const partnerId = obState.partner?.id;
      const saveSeq = ++obState.recognitionSaveSeq;
      const draft = obState.recognitionDraft ?? { selected: [], note: "", text: "" };
      obState.recognitionSuggestSeq += 1;
      obState.recognitionSuggesting = false;
      obState.recognitionSuggestions = [];
      obState.recognitionSuggestionError = "";
      obState.recognitionPrompt = "";
      obState.recognitionSaving = true;
      obRender();
      try {
        await obFlushRecognitionDraft(stateRef, draft);
        const answer = {
          questionId: question.id,
          selected: Array.isArray(draft.selected) ? draft.selected : [],
          note: String(draft.note ?? ""),
          text: String(draft.text ?? ""),
          scenarios: Array.isArray(draft.scenarios) ? draft.scenarios.map((item) => ({ ...item })) : [],
          origin: draft.origin === "scenario" ? "scenario" : "user",
        };
        const result = await api("POST", `recognition/${encodeURIComponent(partnerId)}/answer`, answer);
        if (!result?.recognition) throw new Error("保存回执不完整，请再试一次");
        if (obState !== stateRef || obState.partner?.id !== partnerId || obState.recognitionIndex !== index || obState.recognitionSaveSeq !== saveSeq) return;
        obState.recognition = result.recognition;
        delete obState.recognitionDrafts[question.id];
        if (obState.recognitionIndex >= obState.questions.length - 1) {
          obState.mode = "recognition-done";
        } else {
          obState.recognitionIndex += 1;
          obState.recognitionDraft = null;
        }
        obRender();
      } catch (error) {
        if (obState !== stateRef || obState.partner?.id !== partnerId || obState.recognitionIndex !== index || obState.recognitionSaveSeq !== saveSeq) return;
        obState.recognitionSaving = false;
        obEl.sub.textContent = `没收住：${error.message}`;
        obRender();
      } finally {
        if (obState === stateRef && obState.recognitionSaveSeq === saveSeq && obState.recognitionSaving) {
          obState.recognitionSaving = false;
          obRender();
        }
      }
    }

    function obRenderRecognitionDone() {
      obEl.title.textContent = `和「${obState.partner.name}」认识好了`;
      obEl.sub.textContent = "这些回答已经存进茶话会，之后还可以继续改、继续补。";
      obEl.step.textContent = "已保存";
      obEl.back.hidden = true;
      obEl.next.hidden = false;
      obEl.next.disabled = false;
      obEl.next.textContent = "回去聊";
      const count = Object.keys(obState.recognition?.answers ?? {}).length;
      obEl.body.appendChild(obNode("p", "ob-wait", `这次收下了 ${count} 组回答。你的原话和修正都会保留。`));
    }

    function obNext() {
      if (!obState) return;
      if (obState.mode === "local-create") {
        void obCreateLocal();
        return;
      }
      if (obState.mode === "recognition-done") {
        const preferredPartnerId = obState.partner?.id;
        obClose();
        void bootChat(preferredPartnerId);
        return;
      }
      if (obState.mode === "recognition") {
        void obRecognitionNext();
        return;
      }
      // 还在加载、或者在跑的时候，下一律不许动
      if (obState.running || obState.loadingDraft) return;
      if (obStage === 5) {
        void obBegin();
        return;
      }
      if (obState.error) {
        obState.error = null;
        void obLoadDraft(obState.partner, { force: Boolean(obState.reshape) });
        return;
      }
      if (obStage === 1) {
        const blank = obState.colors.find((color) => !color.name);
        if (blank) {
          obEl.sub.textContent = "每个色都得有个名字";
          return;
        }
        obStage = 2;
        obRender();
        return;
      }
      if (obStage === 2) {
        const empty = obState.colors.find((color) => color.picked.size === 0);
        if (empty) {
          obEl.sub.textContent = `「${empty.name}」一条行为都没挑，至少留一条`;
          return;
        }
        obStage = 3;
        obRender();
        return;
      }
      if (obStage === 3) {
        obStage = 4;
        obRender();
        return;
      }
      void obSave();
    }

    async function obSave() {
      obEl.next.disabled = true;
      obEl.next.textContent = "存着…";
      try {
        const colors = obState.colors.map((color) => ({ id: color.id, name: color.name, role: color.role }));
        const derivatives = [];
        for (const color of obState.colors) {
          for (const row of color.rows) {
            if (color.picked.has(row.id)) {
              derivatives.push({ colorId: color.id, text: row.text, origin: "model", on: true });
            }
          }
        }
        const portrait = (obState.portrait ?? []).filter((row) => row.title && String(row.text).trim());
        await api("POST", "onboarding/save", { agentId: obState.partner.id, colors, derivatives, portrait });
        obQueue.shift();
        if (obQueue.length) {
          obStage = 5;
          obRender();
          return;
        }
        const preferredPartnerId = obState.partner?.id;
        obClose();
        await bootChat(preferredPartnerId);
      } catch (error) {
        obEl.sub.textContent = `没存上：${error.message}`;
        obEl.next.disabled = false;
        obEl.next.textContent = "就这么定";
      }
    }

    obEl.next.addEventListener("click", obNext);
    obEl.back.addEventListener("click", () => {
      if (!obState) return;
      if (obState.mode === "recognition" && obState.recognitionSaving) return;
      if (obState.mode === "recognition") {
        obState.recognitionSuggestSeq += 1;
        obState.recognitionSaveSeq += 1;
        obState.recognitionSuggesting = false;
        obState.recognitionSuggestions = [];
        obState.recognitionPrompt = "";
      }
      if (obState.mode === "local-create") {
        obState.mode = "";
        obStage = 0;
        obRender();
        return;
      }
      if (obState.modeChoice || obState.running || obState.loadingDraft) {
        obClose();
        void bootChat();
        return;
      }
      if (obState.mode === "recognition") {
        if (obState.recognitionIndex > 0) {
          const draft = obState.recognitionDraft;
          if (draft?.questionId) obState.recognitionDrafts[draft.questionId] = { ...draft, selected: [...draft.selected] };
          obState.recognitionIndex -= 1;
          obState.recognitionDraft = null;
          obRender();
        } else {
          obClose();
          void bootChat();
        }
        return;
      }
      if (obStage === 5) {
        obClose();
        void bootChat();
        return;
      }
      if (obStage <= 1) return;
      obStage -= 1;
      obRender();
    });

    /** 进主界面。 */
    async function bootChat(preferredPartnerId = null) {
      await loadPartners();
      try {
        const data = await api("GET", "onboarding");
        obPending = new Set((data?.pending ?? []).map((row) => row.id));
      } catch {
        obPending = new Set();
      }
      const pick = preferredPartnerId && partners.some((p) => p.id === preferredPartnerId && !obPending.has(p.id))
        ? preferredPartnerId
        : lastPartnerId && partners.some((p) => p.id === lastPartnerId && !obPending.has(p.id))
          ? lastPartnerId
          : partners.find((p) => !obPending.has(p.id))?.id ?? partners[0]?.id;
      const action = launchAction;
      launchAction = null;
      if (action?.create) {
        obState = { ...emptyObState(), mode: "local-create" };
        obOpen();
        obRender();
        startPolling();
        bindPresence();
        return;
      }
      if (action?.reshape) {
        const target = partners.find((partner) => partner.id === action.reshape);
        if (target) {
          current = null;
          renderFriends();
          void obStartRecognition(target, { restart: true });
          startPolling();
          bindPresence();
          return;
        }
      }
      if (action?.recognize) {
        const target = partners.find((partner) => partner.id === action.recognize);
        if (target) {
          current = null;
          renderFriends();
          void obPick(target);
          startPolling();
          bindPresence();
          return;
        }
      }
      if (pick) await openPartner(pick);
      startPolling();
      bindPresence();
    }

    (async () => {
      try {
        hana.ready?.({ ok: true });
        const query = new URLSearchParams(window.location.search);
        launchAction = query.get("create") === "1"
          ? { create: true }
          : query.get("reshape") ? { reshape: query.get("reshape") } : query.get("recognize") ? { recognize: query.get("recognize") } : null;
        if (launchAction) {
          const cleanUrl = new URL(window.location.href);
          cleanUrl.searchParams.delete("create");
          cleanUrl.searchParams.delete("reshape");
          cleanUrl.searchParams.delete("recognize");
          window.history.replaceState(null, "", `${cleanUrl.pathname}${cleanUrl.search}${cleanUrl.hash}`);
        }
        const gate = await onboardingPending();
        if (gate?.firstRun) {
          obQueue = [...gate.pending];
          await obBegin();
          if (launchAction?.create) {
            obState = { ...emptyObState(), mode: "local-create" };
            obRender();
          } else if (launchAction?.reshape) {
            const target = obQueue.find((partner) => partner.id === launchAction.reshape);
            if (target) await obStartRecognition(target, { restart: true });
          } else if (launchAction?.recognize) {
            const target = obQueue.find((partner) => partner.id === launchAction.recognize);
            if (target) await obPick(target);
          }
          launchAction = null;
          return;
        }
        await bootChat();
      } catch (error) {
        const message = String(error?.message ?? "");
        // 权限没批是分享版新手最容易撞上的一堵墙，别只丢一句「读不出来」。
        const permissionish = /403|401|权限|permission|forbidden|not authorized/i.test(message);
        setStatus(permissionish
          ? "读不到好友列表：多半是茶话会的应用权限还没开。去「设置 → 安全 → 应用能力」为它打开「读取伙伴」「读取伙伴资料」和「调用模型」，再重新打开这一页。"
          : `好友列表读不出来：${message}`);
      }
    })();
  </script>
</body>
</html>
