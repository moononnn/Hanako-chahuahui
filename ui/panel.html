<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>茶话会</title>
  <script>
    // 样式表得现拉，不能等缓存。
    //
    // 宿主给静态文件挂了长缓存，于是出过这样的事：代码改了、重启了，界面还是老样子
    // （背景铺不上、选图预览还是裁的）。给地址挂一个本次加载的时间戳，每次都对一次。
    // 脚本同步跑在 head 里，body 还没开始画，不会闪。
    for (const href of ["assets/panel.css"]) {
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = `${href}?t=${Date.now()}`;
      document.head.appendChild(link);
    }
  </script>
</head>
<body>
  <div class="shell" id="shell">
    <button class="rail-btn" id="btn-unfold" title="展开伙伴展板" aria-label="展开伙伴展板" hidden>
      <svg class="ico" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path d="M6.4 3.6 10.6 8l-4.2 4.4" />
      </svg>
      <span class="rail-dot" id="rail-dot" hidden></span>
    </button>

    <aside class="friends">
      <div class="friends-head">
        <div class="friends-head-text">
          <h1>
            <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 9.5h11l-1.3 6.9a2 2 0 0 1-1.97 1.6H8.27a2 2 0 0 1-1.97-1.6L5 9.5Z"/>
              <path d="M16 11h1.4a2.4 2.4 0 0 1 0 4.8h-2.2"/>
              <path d="M9.3 6.8c0-.9.7-1.4.7-2.3M12.3 6.8c0-.9.7-1.4.7-2.3"/>
            </svg>
            茶话会
          </h1>
          <p id="subtitle">回房间，随便聊两句</p>
        </div>
        <button class="icon-btn" id="btn-fold" title="收起伙伴展板" aria-label="收起伙伴展板">
          <svg class="ico" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M9.6 3.6 5.4 8l4.2 4.4" />
          </svg>
        </button>
      </div>
      <ul class="friend-list" id="friends"></ul>
    </aside>

    <section class="chat" id="chat">
      <div class="chat-head">
        <span class="chat-av" id="chat-avatar" title="双击戳一下" hidden>
          <span class="ph">?</span>
          <img class="im" alt="" hidden>
        </span>
        <span class="title" id="chat-title">挑个人说话</span>
        <span class="spacer"></span>
        <button class="head-tool" id="btn-appearance" type="button" title="聊天背景" aria-label="打开聊天背景" disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 15.5 13.8 5.7a2.1 2.1 0 0 1 3 3L7 18.5H4v-3Z"/><path d="m11.8 7.7 2.5 2.5M5.5 4.5v3M4 6h3M15.5 13.5v3M14 15h3"/></svg>
        </button>
        <button class="head-tool" id="btn-settings" type="button" title="茶话会设置" aria-label="打开茶话会设置">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.2 2.8h3.6l.5 2a5.9 5.9 0 0 1 1.2.7l1.9-.8 1.8 3.1-1.5 1.4a6.7 6.7 0 0 1 0 1.5l1.5 1.4-1.8 3.1-1.9-.8a5.9 5.9 0 0 1-1.2.7l-.5 2H8.2l-.5-2a5.9 5.9 0 0 1-1.2-.7l-1.9.8-1.8-3.1 1.5-1.4a6.7 6.7 0 0 1 0-1.5L2.8 7.8l1.8-3.1 1.9.8a5.9 5.9 0 0 1 1.2-.7l.5-2Z"/><circle cx="10" cy="10" r="2.2"/></svg>
        </button>
      </div>
      <div class="appearance-popover" id="appearance-popover" hidden>
        <div class="appearance-head"><strong>聊天背景</strong><button class="appearance-close" id="appearance-close" type="button" aria-label="关闭">×</button></div>
        <div class="appearance-preview" id="appearance-preview"><span>选一张背景，看看聊天里的效果</span></div>
        <div class="appearance-gallery" id="appearance-gallery"></div>
        <div class="appearance-actions"><button class="soft-tool" id="appearance-pick" type="button">上传背景</button><button class="text-tool" id="appearance-clear" type="button">清除当前背景</button><input id="appearance-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden></div>
        <label class="appearance-opacity"><span>背景明暗</span><input id="appearance-opacity" type="range" min="0" max="100" step="1"><b id="appearance-opacity-value">52%</b></label>
      </div>
      <div class="stream" id="stream">
        <div class="empty" id="empty-tip">左边点一位伙伴，就能开始聊了<span class="empty-hint">还没有伙伴？点右上角齿轮，去『伙伴管理』建一个茶话会角色</span></div>
      </div>
      <button class="jump-bottom" id="jump-bottom" type="button" title="回到底部" aria-label="回到底部" hidden>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 7.5 5 5 5-5"/></svg>
      </button>
      <div class="composer">
        <div class="emoji-drawer" id="emoji-drawer" hidden>
          <div class="emoji-tabs" id="emoji-tabs" role="tablist" aria-label="表情选择"></div>
          <div class="sticker-new-group" id="sticker-new-group" hidden>
            <input id="sticker-new-group-name" type="text" maxlength="12" placeholder="给这个分组起个名字" aria-label="新分组名">
            <button class="sticker-tool" id="sticker-new-group-ok" type="button">好</button>
            <button class="sticker-tool" id="sticker-new-group-cancel" type="button">算了</button>
          </div>
          <div class="emoji-grid" id="emoji-grid" hidden></div>
          <div class="sticker-picker" id="sticker-picker" hidden>
            <div class="sticker-picker-head">
              <span id="sticker-picker-title">表情包</span>
              <span class="picker-spacer"></span>
              <button class="sticker-tool" id="sticker-group-delete" type="button" hidden>删分组</button>
              <button class="sticker-tool" id="sticker-manage" type="button">管理</button>
              <button class="sticker-add" id="sticker-add" type="button">添加</button>
            </div>
            <div class="sticker-tools" id="sticker-search-row">
              <input id="sticker-search" type="search" placeholder="在图库里找一张…" aria-label="搜索表情包">
            </div>
            <div class="sticker-grid" id="sticker-grid"></div>
            <div class="sticker-empty" id="sticker-empty" hidden>
              <p id="sticker-empty-text">图库还空着</p>
              <button class="sticker-add-empty" id="sticker-add-empty" type="button">从表情包图库添加</button>
            </div>
          </div>
          <div class="sticker-import" id="sticker-import" hidden>
            <div class="sticker-picker-head">
              <button class="sticker-back" id="sticker-import-back" type="button">‹ 返回图库</button>
              <span class="picker-spacer"></span>
              <button class="sticker-tool" id="sticker-import-retry" type="button" hidden>重试</button>
            </div>
            <div class="sticker-tools">
              <input id="source-search" type="search" placeholder="搜索情绪、场景或关键词…" aria-label="搜索表情包图库">
            </div>
            <div class="sticker-note" id="sticker-import-note" hidden></div>
            <div class="sticker-source-grid" id="sticker-source-grid"></div>
            <div class="sticker-import-foot">
              <span id="sticker-selected-count">已选 0 张</span>
              <input id="new-sticker-group" type="text" maxlength="40" placeholder="新分组名（可选）" aria-label="新分组名">
              <button id="sticker-import-confirm" type="button">添加到图库</button>
            </div>
          </div>
        </div>
        <div class="pending-image" id="pending-image" hidden>
          <button class="pending-image-view" id="pending-image-view" type="button" title="点击放大查看待发送图片">
            <img id="pending-image-thumb" alt="待发送图片">
            <span class="pending-image-badge">图片</span>
          </button>
          <div class="pending-image-copy">
            <strong id="pending-image-state">准备发给 ta</strong>
            <span id="pending-image-name">图片</span>
          </div>
          <button class="pending-image-remove" id="pending-image-remove" type="button" title="取消这张图片" aria-label="取消这张图片">×</button>
        </div>
        <div class="pending-sticker" id="pending-sticker" hidden>
          <div class="pending-sticker-view">
            <img id="pending-sticker-thumb" alt="待发送表情包">
            <span class="pending-image-badge">表情包</span>
          </div>
          <div class="pending-image-copy">
            <strong id="pending-sticker-state">准备发给 ta</strong>
            <span id="pending-sticker-name">表情包</span>
          </div>
          <button class="pending-image-remove" id="pending-sticker-remove" type="button" title="取消这张表情包" aria-label="取消这张表情包">×</button>
        </div>
        <div class="status-line" id="status" role="status" aria-live="polite"></div>
        <div class="composer-row">
          <button class="emoji-btn image-btn" id="btn-image" type="button" title="添加图片" aria-label="添加图片" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3.2" y="3.5" width="13.6" height="13" rx="2"></rect><circle cx="7.2" cy="7.5" r="1.2"></circle><path d="m4.8 14.2 3.4-3.4 2.4 2.2 1.8-1.7 2.8 2.9M14.8 3.2v4.2M12.7 5.3h4.2"></path></svg>
          </button>
          <input id="image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
          <button class="emoji-btn" id="btn-emoji" type="button" title="表情和表情包" aria-label="打开表情和表情包" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.2"></circle><path d="M6.8 11.8c.9 1.1 1.9 1.6 3.2 1.6s2.3-.5 3.2-1.6M7.2 8h.1M12.7 8h.1"></path></svg>
          </button>
          <textarea id="input" rows="1" placeholder="说点什么…" title="Enter 发送，Shift+Enter 换行" aria-label="输入消息，最多 12000 字" disabled maxlength="12000"></textarea>
          <button class="send" id="btn-send" type="button" title="发送" aria-label="发送" disabled>
            <svg class="send-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m3.2 9.1 13.5-5.4-3.4 13.1-3.1-5.1-7-2.6Z"></path><path d="m10.2 11.7 6.5-8"></path></svg>
            <svg class="send-confirm" viewBox="0 0 20 20" aria-hidden="true"><path d="m4.2 10.2 3.7 3.7 8-8"></path></svg>
          </button>
        </div>
      </div>
    </section>
    <div class="settings-view" id="settings-view" hidden>
      <iframe id="settings-frame" title="茶话会设置" loading="lazy"></iframe>
    </div>
  </div>

  <div class="image-lightbox" id="image-lightbox" hidden role="dialog" aria-modal="true" aria-label="查看图片">
    <button class="image-lightbox-close" id="image-lightbox-close" type="button" aria-label="关闭图片预览">×</button>
    <img id="image-lightbox-image" alt="图片预览">
  </div>

  <!-- 认识 ta：没完成初步认识的伙伴不能开始聊。性格是这应用的魂，得先一起聊过一遍。 -->
  <div class="ob" id="ob" hidden>
    <div class="ob-card">
      <header class="ob-head">
        <h2 id="ob-title">先认识一位伙伴</h2>
        <p id="ob-sub"></p>
      </header>
      <div class="ob-body" id="ob-body"></div>
      <footer class="ob-foot">
        <span class="ob-step" id="ob-step"></span>
        <span class="ob-gap"></span>
        <button class="ob-btn ghost" id="ob-back" type="button" hidden>上一步</button>
        <button class="ob-btn primary" id="ob-next" type="button">下一步</button>
      </footer>
    </div>
  </div>

  <script type="module">
    import { hana } from "./assets/sdk.js";
    import { analyzeBackgroundUrl, buttonThemeFromSample } from "./assets/background-adaptive.js";

    const el = {
      shell: document.getElementById("shell"),
      fold: document.getElementById("btn-fold"),
      unfold: document.getElementById("btn-unfold"),
      railDot: document.getElementById("rail-dot"),
      friends: document.getElementById("friends"),
      chat: document.getElementById("chat"),
      stream: document.getElementById("stream"),
      jumpBottom: document.getElementById("jump-bottom"),
      input: document.getElementById("input"),
      send: document.getElementById("btn-send"),
      imageButton: document.getElementById("btn-image"),
      imageFile: document.getElementById("image-file"),
      pendingImage: document.getElementById("pending-image"),
      pendingImageView: document.getElementById("pending-image-view"),
      pendingImageThumb: document.getElementById("pending-image-thumb"),
      pendingImageState: document.getElementById("pending-image-state"),
      pendingImageName: document.getElementById("pending-image-name"),
      pendingImageRemove: document.getElementById("pending-image-remove"),
      pendingSticker: document.getElementById("pending-sticker"),
      pendingStickerThumb: document.getElementById("pending-sticker-thumb"),
      pendingStickerState: document.getElementById("pending-sticker-state"),
      pendingStickerName: document.getElementById("pending-sticker-name"),
      pendingStickerRemove: document.getElementById("pending-sticker-remove"),
      imageLightbox: document.getElementById("image-lightbox"),
      imageLightboxClose: document.getElementById("image-lightbox-close"),
      imageLightboxImage: document.getElementById("image-lightbox-image"),
      chatAvatar: document.getElementById("chat-avatar"),
      title: document.getElementById("chat-title"),
      settingsButton: document.getElementById("btn-settings"),
      appearanceButton: document.getElementById("btn-appearance"),
      settingsView: document.getElementById("settings-view"),
      settingsFrame: document.getElementById("settings-frame"),
      appearancePopover: document.getElementById("appearance-popover"),
      appearanceClose: document.getElementById("appearance-close"),
      appearancePreview: document.getElementById("appearance-preview"),
      appearanceGallery: document.getElementById("appearance-gallery"),
      appearancePick: document.getElementById("appearance-pick"),
      appearanceClear: document.getElementById("appearance-clear"),
      appearanceFile: document.getElementById("appearance-file"),
      appearanceOpacity: document.getElementById("appearance-opacity"),
      appearanceOpacityValue: document.getElementById("appearance-opacity-value"),
      status: document.getElementById("status"),
      subtitle: document.getElementById("subtitle"),
      emptyTip: document.getElementById("empty-tip"),
      emojiButton: document.getElementById("btn-emoji"),
      emojiDrawer: document.getElementById("emoji-drawer"),
      emojiTabs: document.getElementById("emoji-tabs"),
      stickerNewGroup: document.getElementById("sticker-new-group"),
      stickerNewGroupName: document.getElementById("sticker-new-group-name"),
      stickerNewGroupOk: document.getElementById("sticker-new-group-ok"),
      stickerNewGroupCancel: document.getElementById("sticker-new-group-cancel"),
      emojiGrid: document.getElementById("emoji-grid"),
      stickerPicker: document.getElementById("sticker-picker"),
      stickerSearch: document.getElementById("sticker-search"),
      stickerSearchRow: document.getElementById("sticker-search-row"),
      stickerAdd: document.getElementById("sticker-add"),
      stickerAddEmpty: document.getElementById("sticker-add-empty"),
      stickerManage: document.getElementById("sticker-manage"),
      stickerGroupDelete: document.getElementById("sticker-group-delete"),
      stickerGrid: document.getElementById("sticker-grid"),
      stickerEmpty: document.getElementById("sticker-empty"),
      stickerEmptyText: document.getElementById("sticker-empty-text"),
      stickerImport: document.getElementById("sticker-import"),
      stickerImportBack: document.getElementById("sticker-import-back"),
      stickerImportRetry: document.getElementById("sticker-import-retry"),
      stickerImportNote: document.getElementById("sticker-import-note"),
      sourceSearch: document.getElementById("source-search"),
      stickerSourceGrid: document.getElementById("sticker-source-grid"),
      stickerSelectedCount: document.getElementById("sticker-selected-count"),
      newStickerGroup: document.getElementById("new-sticker-group"),
      stickerImportConfirm: document.getElementById("sticker-import-confirm"),
    };

    let partners = [];
    let current = null;
    let lastPartnerId = null;
    let busy = false;
    // 请求被后端拒绝或失败时先把原话寄存在对应伙伴名下，切回来还能接着发。
    const pendingDrafts = new Map();
    let inputOwner = null;
    let inputRevision = 0;
    let pendingImage = null;
    let imageChoiceSeq = 0;
    let pendingSticker = null;
    let openPartnerSeq = 0;
    let partnersLoadSeq = 0;
    /** 已经画过的消息 id，用来增量补新消息（戳一下之后要等ta回应） */
    let seenIds = new Set();
    /** 聊天窗里要不要给两边挂头像（设置里开的，默认关，跟以前一样） */
    let showMessageAvatars = false;
    /** 默认关闭：打开后才给伙伴回复显示重新生成/编辑入口。 */
    let messageRefineEnabled = false;
    /** id → 表情。跟叫法表同源（后端随 /partners 发下来），不在前端另拄一份 */
    let actionEmoji = new Map();
    /** 画当前这一屏时用的是哪种外观；跟设置对不上就整段重画 */
    let paintedWithAvatars = null;
    /** 当前这个窗的全部消息（重画时要拿回来） */
    let currentMessages = [];
    /** 聊天请求只对发起时那一代窗口有效；切窗后旧回包一律丢掉。 */
    let threadViewSeq = 0;
    /** 重画或切窗会让正在播放/补画的旧任务失效，避免旧任务重新往新窗口塞气泡。 */
    let renderGeneration = 0;
    let liveDots = null;
    let appendNewQueue = Promise.resolve();
    /** 从设置页跳进来的单次建档动作；消费后立刻清掉 URL，避免 bootChat 重入。 */
    let launchAction = null;
    let appearanceBackground = null;
    let appearanceGalleryUrls = [];
    let appearanceOpacityTimer = null;
    let statusTimer = null;
    let armedBackgroundFile = "";
    let armedBackgroundTimer = null;

    /**
     * 左边那块伙伴展板收不收。
     *
     * 茶话会经常跟主对话框并排开着，窗口一窄，展板占着 244px 就显得挤；
     * 收起来聊天区整块让过去。她自己点过就认她的，没点过就看窗口宽窄自己走——
     * 而且窗口宽窄一变就重新判（以前只在开场判一次，先把窗口拉宽、再拉窄，展板就赖着不让位）。
     * 手动那笔只在她当时那一档宽度里算数，跨过档位就还给自动，不然一次点击会按着窄窗不让收。
     */
    const FOLD_KEY = "chahuahui.listCollapsed";
    const FOLD_AUTO_WIDTH = 820;
    /** 窄到这个份上展板就浮到聊天区上（跟 CSS 里那条断点对齐），选完伙伴自己收 */
    const NARROW_WIDTH = 600;
    /** 她手动点的收/展；null = 没点过，跟着窗口宽窄走 */
    let foldManual = null;
    /** 上一回的自动判断，用来认出「跨档了」 */
    let foldAutoLast = null;

    const autoFolds = () => window.innerWidth < FOLD_AUTO_WIDTH;
    const isNarrow = () => window.innerWidth < NARROW_WIDTH;

    function applyFolded(collapsed, { persist = true } = {}) {
      const fold = Boolean(collapsed);
      el.shell.classList.toggle("list-collapsed", fold);
      el.unfold.hidden = !fold;
      if (el.emptyTip?.isConnected) {
        el.emptyTip.innerHTML = fold
          ? "伙伴展板收起来了<br>点左边的把手展开"
          : "左边点一位伙伴<br>就能开始聊了";
      }
      if (persist) {
        try { localStorage.setItem(FOLD_KEY, fold ? "1" : "0"); } catch { /* 记不住就算了，这一轮照用 */ }
      }
    }

    /** 该收还是该展：她手动点过就认她的，没点过看窗口宽窄 */
    function foldWanted() {
      return foldManual === null ? autoFolds() : foldManual;
    }

    function syncFold({ persist = false } = {}) {
      applyFolded(foldWanted(), { persist });
    }

    {
      let stored = null;
      try { stored = localStorage.getItem(FOLD_KEY); } catch { /* 读不到就当没选过 */ }
      if (stored !== null) foldManual = stored === "1";
      foldAutoLast = autoFolds();
      syncFold();
    }

    // 窗口宽窄一変就重新判；跨过档位就把手动那笔让开，回到自动
    window.addEventListener("resize", () => {
      const nowAuto = autoFolds();
      if (nowAuto !== foldAutoLast) {
        foldAutoLast = nowAuto;
        foldManual = null;
      }
      if (foldWanted() !== el.shell.classList.contains("list-collapsed")) syncFold();
    });

    function foldByHand(value) {
      foldManual = value;
      applyFolded(value);
    }

    // 窄窗下展板是盖在聊天区上的浮层，选完人得把它收回去，不然聊天窗一直被盖着
    function foldAfterPick() {
      if (isNarrow() && !el.shell.classList.contains("list-collapsed")) {
        applyFolded(true, { persist: false });
      }
    }

    el.fold.addEventListener("click", () => foldByHand(true));
    el.unfold.addEventListener("click", () => foldByHand(false));

    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    /**
     * 头像现拉现用。
     * 图在后端现读 Hana 那边的头像文件，所以 Hana 里换了头像，这边跟着换；
     * 请求要带 App 票据，不能用裸 img src（宿主会判 403），所以走 blob。
     * 拉不到就不放图，退回一个字。
     */
    const AVATAR_TTL_MS = 5 * 60 * 1000;
    /** agentId → { at, url }；拉不到也记一笔，免得每轮轮询都去敲一遍 */
    const avatarCache = new Map();

    async function loadAvatar(agentId) {
      const hit = avatarCache.get(agentId);
      if (hit && Date.now() - hit.at < AVATAR_TTL_MS) return hit.url;
      let url = null;
      try {
        const res = await hana.api.fetch(`avatar/${encodeURIComponent(agentId)}`, { method: "GET" });
        if (res.ok) {
          const blob = await res.blob();
          if (blob.size > 0) url = URL.createObjectURL(blob);
        }
      } catch { /* 没头像就算了，退回一个字 */ }
      const prev = avatarCache.get(agentId)?.url;
      if (prev && prev !== url) URL.revokeObjectURL(prev);
      avatarCache.set(agentId, { at: Date.now(), url });
      return url;
    }

    /**
     * 表情包：气泡里存的是哨兵串，真正的图走后端现读现发。
     * 跟头像一样得带 App 票据，裸 img src 会被判 403，所以走 blob。
     */
    const STICKER_PREFIX = "\u0001stk:";
    const stickerCache = new Map();

    function stickerIdOf(text) {
      return typeof text === "string" && text.startsWith(STICKER_PREFIX)
        ? text.slice(STICKER_PREFIX.length)
        : "";
    }

    /**
     * 老消息里可能残留的光杆标记（模型漏写关键词那次的产物，形如「[表情]」）。
     * 已经存进账本的历史改不了，这一层把它挡在屏幕外，免得聊天里冒出三个字。
     */
    const BARE_MARKER_RE = /^\s*[\[【［]\s*表情包?\s*[:：]?\s*[\]】］]\s*$/;
    function isBareStickerMarker(text) {
      return typeof text === "string" && BARE_MARKER_RE.test(text);
    }

    /**
     * 取一张图。图库里的图跟「来源图库」的图走两条路：
     * 图库走 /sticker/:agentId/:id（自己复制的，跟伙伴无关），
     * 来源走 /source-sticker/:id（导入页要看全库，不能被伙伴白名单筛）。
     */
    async function loadStickerImage(stickerId, { source = false, agentId = current } = {}) {
      const imageId = String(stickerId || "");
      if (!imageId) return null;
      if (!source && !agentId) return null;
      const key = source ? `src\u0000${imageId}` : `own\u0000${String(agentId)}\u0000${imageId}`;
      if (stickerCache.has(key)) return stickerCache.get(key);
      const path = source
        ? `source-sticker/${encodeURIComponent(imageId)}`
        : `sticker/${encodeURIComponent(agentId)}/${encodeURIComponent(imageId)}`;
      let url = null;
      try {
        const res = await hana.api.fetch(path, { method: "GET" });
        if (res.ok) {
          const blob = await res.blob();
          if (blob.size > 0) url = URL.createObjectURL(blob);
        }
      } catch { /* 读不到就当没这张图，这一条不显示 */ }
      stickerCache.set(key, url);
      return url;
    }

    /** 兼容老名字：聊天气泡只要一张图，不关心来源。 */
    function loadSticker(stickerId, agentId = current) {
      return loadStickerImage(stickerId, { agentId });
    }

    /**
     * 图多得吓人（三百多张），一次全发请求会把宿主顶住。
     * 排个队，最多四张同时在路上，画完自动补下一张。
     */
    const imageJobs = [];
    let imageRunning = 0;
    const IMAGE_CONCURRENCY = 4;

    function queueStickerImage(img, stickerId, options = {}) {
      imageJobs.push({ img, stickerId, options });
      pumpStickerImages();
    }

    function pumpStickerImages() {
      while (imageRunning < IMAGE_CONCURRENCY && imageJobs.length) {
        const job = imageJobs.shift();
        imageRunning += 1;
        void loadStickerImage(job.stickerId, job.options)
          .then((url) => { if (url && job.img.isConnected) job.img.src = url; })
          .catch(() => { /* 读不到就不放图 */ })
          .finally(() => { imageRunning -= 1; pumpStickerImages(); });
      }
    }

    /*
     * 悬浮大预览：格子缩到五十来像素之后，单看小图认不出是哪一张。
     * 鼠标停到格子上，就在光标边上浮一张大的。
     * 节点挂在 body 上、fixed 定位，为的是躲开抽屉和网格两层滚动容器；
     * 放它们里面的话，放大出来的部分会被 overflow 裁掉，越靠边的图越明显。
     */
    const hoverPreview = document.createElement("div");
    hoverPreview.className = "sticker-hover-preview";
    hoverPreview.hidden = true;
    const hoverPreviewImg = document.createElement("img");
    hoverPreviewImg.alt = "";
    hoverPreview.appendChild(hoverPreviewImg);
    document.body.appendChild(hoverPreview);
    let hoverPreviewOwner = null;

    function hideStickerPreview() {
      hoverPreviewOwner = null;
      hoverPreview.hidden = true;
      hoverPreviewImg.removeAttribute("src");
    }

    function placeStickerPreview(event) {
      const box = hoverPreview.getBoundingClientRect();
      const gap = 16;
      let left = event.clientX + gap;
      let top = event.clientY + gap;
      // 碰边就翻到光标另一侧，别把预览顶出屏幕
      if (left + box.width > window.innerWidth - 8) left = event.clientX - gap - box.width;
      if (top + box.height > window.innerHeight - 8) top = event.clientY - gap - box.height;
      hoverPreview.style.left = `${Math.max(8, Math.round(left))}px`;
      hoverPreview.style.top = `${Math.max(8, Math.round(top))}px`;
    }

    function showStickerPreview(img, event) {
      // 图还没到就没什么好预览的，也不排队等它
      const src = img.currentSrc || img.src;
      if (!src) return;
      if (hoverPreviewOwner === img) return;
      hoverPreviewOwner = img;
      hoverPreviewImg.src = src;
      hoverPreview.hidden = false;
      placeStickerPreview(event);
    }

    /** 两个网格共用一套，事件委托挂一次就够，重画时不用重绑 */
    function bindStickerPreview(grid) {
      grid.addEventListener("mouseover", (event) => {
        const img = event.target;
        if (!img || img.tagName !== "IMG") return;
        if (!img.closest(".sticker-pick, .sticker-source-choice")) return;
        showStickerPreview(img, event);
      });
      grid.addEventListener("mousemove", (event) => { if (hoverPreviewOwner) placeStickerPreview(event); });
      grid.addEventListener("mouseout", (event) => { if (event.target === hoverPreviewOwner) hideStickerPreview(); });
      // 滚动之后光标没动位，预览留在原地反而误事，先收起来
      grid.addEventListener("scroll", hideStickerPreview, { passive: true });
    }
    bindStickerPreview(el.stickerGrid);
    bindStickerPreview(el.stickerSourceGrid);

    const BUILTIN_EMOJI = [
      "😀", "😄", "😂", "🥹", "🥰", "😌", "😎", "🤔", "😮", "😳", "😤", "😅",
      "🙄", "😑", "😶", "🥲", "😭", "😡", "🤗", "🫶", "👍", "👎", "👏", "✨",
    ];
    /** 自己挑进来的图库、自己建的分组、以及表情包插件那边的全库（只当进货来源） */
    let stickerRows = [];
    let stickerGroups = [];
    let activeStickerGroup = "__all";
    let emojiPage = "emoji";
    let sourceRows = [];
    let sourceMatched = [];
    let sourceShown = 0;
    let sourceAvailable = false;
    let sourceReason = "";
    let sourceHiddenUntagged = 0;
    /** 图库是为哪个伙伴拉的；没拉过或换了人就得重拉 */
    let stickerLoadedFor = null;
    /** 正在添加图库：锁住那个按钮，挡住连点造成的重复提交 */
    let importing = false;
    const selectedSourceIds = new Set();
    /** 管理态：缩略图角上冒一把叉，这会儿点图不发图，只删图 */
    let manageMode = false;
    let armedStickerId = "";
    let armedGroupDelete = false;
    /**
     * 来源一批批往下画，画完在末尾留个哨兵：它一露头就补下一批（见 renderSourceMore）。
     * 批次不能取消——每张图都是一次请求加一次解码，三百多张一起上，卡的是宿主，
     * 跟格子变小没关系。但她也不该为这个数字操心，所以“再看”那个按钮换成滑到底自己续。
     */
    const SOURCE_BATCH = 40;
    /** 图库超过这个数才摆搜索框；小格子一屏能放开四十来张，够看就不用找 */
    const SEARCH_FROM = 20;
    /**
     * 一次点「添加到图库」分几趟送。
     * 送一趟就能报一个实在的数字（“正在添加 16/40”），不是转圈糊弄；
     * 整批一次发过去她要盯着一个不动的界面等十几秒。
     */
    const IMPORT_CHUNK = 8;

    /**
     * 顶上那一排：Emoji、表情包（就是全部）、她建的每个分组、＋。
     * 以前末尾还挂个「收起」，现在点抽屉外面就收，那个按钮不必罢了。
     * 分组直接升格成 tab，不再藏在第二层。
     */
    function renderStickerTabs() {
      el.emojiTabs.innerHTML = "";
      const put = (label, { active = false, extra = "", title = "", onClick = null } = {}) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `emoji-tab${active ? " active" : ""}${extra ? ` ${extra}` : ""}`;
        button.textContent = label;
        if (title) button.title = title;
        if (onClick) button.addEventListener("click", onClick);
        el.emojiTabs.appendChild(button);
      };
      put("Emoji", { active: emojiPage === "emoji", onClick: () => setEmojiPage("emoji") });
      put("表情包", {
        active: emojiPage === "sticker" && activeStickerGroup === "__all",
        onClick: () => pickStickerGroup("__all"),
      });
      for (const group of stickerGroups) {
        put(group.name, {
          active: emojiPage === "sticker" && activeStickerGroup === group.id,
          onClick: () => pickStickerGroup(group.id),
        });
      }
      put("＋", {
        extra: "add",
        title: "新建分组",
        onClick: () => (el.stickerNewGroup.hidden ? openNewGroupRow() : closeNewGroupRow()),
      });
    }

    function setEmojiPage(page) {
      emojiPage = page === "sticker" ? "sticker" : "emoji";
      const stickers = emojiPage === "sticker";
      el.emojiGrid.hidden = stickers;
      el.stickerPicker.hidden = !stickers;
      el.stickerImport.hidden = true;
      if (!stickers) imageJobs.length = 0;
      clearSourceSentinel();
      hideStickerPreview();
      renderStickerTabs();
    }

    /**
     * 切分组：同一个抽屉里换页。
     * 图库拉过一次就不重复敲后端，但「一次都没拉过」和「换了伙伴」必须拉——
     * 少了这一步，添加页会拿初始值把「还没拉」误判成「读不出来」。
     */
    async function ensureStickerLibrary() {
      if (stickerLoadedFor === current) return;
      await loadStickerLibrary();
    }

    function pickStickerGroup(groupId) {
      activeStickerGroup = groupId;
      manageMode = false;
      armedStickerId = "";
      armedGroupDelete = false;
      el.stickerManage.textContent = "管理";
      el.stickerGroupDelete.textContent = "删分组";
      el.stickerGroupDelete.hidden = true;
      setEmojiPage("sticker");
      renderStickerRows();
      void ensureStickerLibrary();
    }

    function openEmojiDrawer(page = "emoji") {
      if (!current) return;
      el.emojiDrawer.hidden = false;
      setEmojiPage(page);
      /*
       * 打开就拉，不分哪一页。
       * 顶上那排 tab 是拿图库数据画的（她建的分组全在里面），
       * 挂到「点了 tab 才拉」就晚了——第一次打开抽屉分组是空的，
       * 得先点一下「表情包」它们才冒出来。
       */
      void loadStickerLibrary();
    }

    function closeEmojiDrawer() {
      el.emojiDrawer.hidden = true;
      armedStickerId = "";
      armedGroupDelete = false;
      closeNewGroupRow();
      hideStickerPreview();
    }

    function renderEmojiGrid() {
      el.emojiGrid.innerHTML = "";
      for (const emoji of BUILTIN_EMOJI) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "emoji-choice";
        button.textContent = emoji;
        button.title = `插入 ${emoji}`;
        button.addEventListener("click", () => {
          const start = el.input.selectionStart ?? el.input.value.length;
          const end = el.input.selectionEnd ?? start;
          el.input.value = `${el.input.value.slice(0, start)}${emoji}${el.input.value.slice(end)}`;
          el.input.selectionStart = el.input.selectionEnd = start + emoji.length;
          autosizeInput();
          el.input.focus();
        });
        el.emojiGrid.appendChild(button);
      }
    }

    function rowsForGroup() {
      const query = String(el.stickerSearch.value || "").trim().toLowerCase();
      return stickerRows.filter((row) => {
        if (activeStickerGroup !== "__all" && !(row.groupIds || []).includes(activeStickerGroup)) return false;
        if (!query) return true;
        return [row.description, ...(row.emotion || []), ...(row.scene || []), ...(row.keywords || [])]
          .join(" ").toLowerCase().includes(query);
      });
    }

    function renderStickerRows() {
      /*
       * 图库页没露脸就不画。
       * 画一次就要把每一张图排进队列去取（一张一次请求加一次解码），
       * 只是打开 Emoji 那一页却顺带取三百多张，白烧宿主。
       * 数据先拉到（顶上那排 tab 要用），格子等露脸时再画。
       */
      if (el.emojiDrawer.hidden || el.stickerPicker.hidden) return;
      const rows = rowsForGroup();
      el.stickerGrid.innerHTML = "";
      imageJobs.length = 0;
      for (const row of rows) {
        const cell = document.createElement("div");
        const armed = armedStickerId === row.id;
        cell.className = `sticker-choice${manageMode ? " managing" : ""}${armed ? " armed" : ""}`;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "sticker-pick";
        button.title = row.description || row.emotion?.[0] || row.scene?.[0] || "发送表情包";
        const img = document.createElement("img");
        img.alt = button.title;
        button.appendChild(img);
        button.addEventListener("click", () => { if (!manageMode) selectSticker(row); });
        cell.appendChild(button);
        queueStickerImage(img, row.id);
        if (manageMode) {
          const kill = document.createElement("button");
          kill.type = "button";
          kill.className = "sticker-kill";
          kill.textContent = armed ? "再点" : "✕";
          kill.title = armed ? "再点一下就从图库删掉" : "从图库删掉这张";
          kill.addEventListener("click", () => void armOrRemoveSticker(row.id));
          cell.appendChild(kill);
        }
        el.stickerGrid.appendChild(cell);
      }
      el.stickerEmpty.hidden = rows.length > 0;
      // 图少的时候不摆这一行：一屏能看完，就没什么好找的。
      // 按整个图库的大小算，不按当前分组算——切来切去忽隐忽现更像毛病。
      const wantSearch = stickerRows.length > SEARCH_FROM;
      el.stickerSearchRow.hidden = !wantSearch;
      if (!wantSearch && el.stickerSearch.value) el.stickerSearch.value = "";
      if (!rows.length) {
        el.stickerEmptyText.textContent = stickerRows.length
          ? "这个分组里还没有图"
          : (sourceAvailable ? "图库还空着，去挑几张你喜欢的" : "图库还空着；表情包图库这会儿也读不出来");
      }
    }

    async function loadStickerLibrary() {
      const agentId = current;
      try {
        const [library, source] = await Promise.all([
          api("GET", "library/stickers"),
          api("GET", "sticker-source"),
        ]);
        if (current !== agentId) return;
        stickerRows = library.stickers || [];
        stickerGroups = library.groups || [];
        sourceRows = source.stickers || [];
        sourceAvailable = source.available === true;
        sourceReason = String(source.reason || "");
        sourceHiddenUntagged = Number(source.hiddenUntagged || 0);
        if (activeStickerGroup !== "__all" && !stickerGroups.some((group) => group.id === activeStickerGroup)) {
          activeStickerGroup = "__all";
        }
        stickerLoadedFor = agentId;
        // 来源读不到时「添加」不藏起来：点进去讲明白为什么，还带重试。
        // 藏起来只会让她以为功能没了。
        renderStickerTabs();
        renderStickerRows();
      } catch (error) {
        if (current !== agentId) return;
        stickerRows = [];
        stickerGroups = [];
        sourceRows = [];
        sourceAvailable = false;
        sourceReason = "request-failed";
        stickerLoadedFor = null;
        renderStickerTabs();
        renderStickerRows();
        setStatus(`表情包读不出来：${error.message}`);
      }
    }

    /** 来源没读到的时候要说人话，别拿一句“请确认插件已启动”冤枉人。 */
    function sourceProblemText() {
      const map = {
        "not-found": "没找到表情包图库的快照文件。插件装了但快照还没生成时会这样。",
        "read-failed": "读那份快照的时候被挡了一下，稍后再试。",
        "bad-json": "快照文件读出来了，但内容是坏的。",
        "schema-mismatch": "快照格式对不上，多半是表情包插件换过版本。",
        "empty": "那边图库是空的，先去表情包里加几张。",
        "no-data-dir": "应用没拿到自己的数据目录，这个不对劲。",
        "request-failed": "请求没发出去。",
      };
      // 没拿到原因不能糊过去：把原样摆出来，下次一看就知道是哪儿没对上。
      if (!sourceReason) return "表情包图库没读到，而且没说是什么原因（多半是后端还没重新装载）。";
      return map[sourceReason] || `表情包图库读不出来：${sourceReason}`;
    }

    async function openStickerImport() {
      selectedSourceIds.clear();
      el.sourceSearch.value = "";
      el.stickerPicker.hidden = true;
      el.stickerImport.hidden = false;
      el.stickerImportRetry.hidden = true;
      el.stickerImportNote.hidden = true;
      el.stickerSourceGrid.innerHTML = "";
      el.stickerSelectedCount.textContent = "已选 0 张";
      // 先把图库拉起一次再判断，不然「还没拉」会被当成「拉不到」。
      await ensureStickerLibrary();
      if (!sourceAvailable) {
        const note = document.createElement("div");
        note.className = "sticker-source-msg";
        note.textContent = sourceProblemText();
        el.stickerSourceGrid.appendChild(note);
        el.stickerImportRetry.hidden = false;
        return;
      }
      renderSourceRows();
    }

    function sourceQuery() {
      return String(el.sourceSearch.value || "").trim().toLowerCase();
    }

    function renderSourceRows() {
      const query = sourceQuery();
      sourceMatched = sourceRows.filter((item) => (
        !query || [item.description, ...(item.emotion || []), ...(item.scene || []), ...(item.keywords || [])]
          .join(" ").toLowerCase().includes(query)
      ));
      sourceShown = 0;
      clearSourceSentinel();
      el.stickerSourceGrid.innerHTML = "";
      imageJobs.length = 0;
      appendSourceBatch(SOURCE_BATCH);
      el.stickerImportNote.hidden = sourceHiddenUntagged <= 0;
      if (sourceHiddenUntagged > 0) {
        el.stickerImportNote.textContent = `已藏起 ${sourceHiddenUntagged} 张没标签的图（伙伴读不懂，所以不给选）`;
      }
    }

    function appendSourceBatch(size) {
      const slice = sourceMatched.slice(sourceShown, sourceShown + size);
      sourceShown += slice.length;
      for (const row of slice) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `sticker-source-choice${selectedSourceIds.has(row.id) ? " selected" : ""}`;
        button.title = row.description || "选择表情包";
        const img = document.createElement("img");
        img.alt = button.title;
        button.appendChild(img);
        button.addEventListener("click", () => {
          if (selectedSourceIds.has(row.id)) selectedSourceIds.delete(row.id);
          else selectedSourceIds.add(row.id);
          button.classList.toggle("selected", selectedSourceIds.has(row.id));
          el.stickerSelectedCount.textContent = `已选 ${selectedSourceIds.size} 张`;
        });
        el.stickerSourceGrid.appendChild(button);
        queueStickerImage(img, row.id, { source: true });
      }
      el.stickerSelectedCount.textContent = `已选 ${selectedSourceIds.size} 张`;
      renderSourceMore();
    }

    let sourceSentinel = null;
    let sourceWatcher = null;

    function clearSourceSentinel() {
      if (sourceWatcher) { sourceWatcher.disconnect(); sourceWatcher = null; }
      if (sourceSentinel) { sourceSentinel.remove(); sourceSentinel = null; }
    }

    /**
     * 末尾的哨兵：它一滑进视野（带一屏左右的提前量）就补下一批。
     * 补到填满眼前这屏为止——窄窗口补到三十来张就停，宽窗口补到九十多，两边都不浪费。
     * 每批之间隔着一次渲染，不会一下子卡住。
     */
    function renderSourceMore() {
      clearSourceSentinel();
      const rest = sourceMatched.length - sourceShown;
      if (rest <= 0) return;
      const sentinel = document.createElement("div");
      sentinel.className = "sticker-source-sentinel";
      sentinel.textContent = `往下滑，还有 ${rest} 张`;
      el.stickerSourceGrid.appendChild(sentinel);
      sourceSentinel = sentinel;
      sourceWatcher = new IntersectionObserver((entries) => {
        if (!entries.some((entry) => entry.isIntersecting)) return;
        appendSourceBatch(SOURCE_BATCH);
      }, { root: el.stickerSourceGrid, rootMargin: "120px 0px" });
      sourceWatcher.observe(sentinel);
    }

    /**
     * 建分组：⚠️ 这里绝不能用 window.prompt。
     * Hana 的 App 页面跑在 webview 里，Electron 根本不实现原生输入弹窗，
     * 调下去既不弹窗也不报错，名字永远是空的——表现就是「点了＋没反应」。
     * 所以改成在抽屉里就地摊开一行输入。
     */
    function openNewGroupRow() {
      el.stickerNewGroup.hidden = false;
      el.stickerNewGroupName.value = "";
      el.stickerNewGroupName.focus();
    }

    function closeNewGroupRow() {
      el.stickerNewGroup.hidden = true;
      el.stickerNewGroupName.value = "";
    }

    async function submitNewGroup() {
      const name = el.stickerNewGroupName.value.trim();
      if (!name) {
        el.stickerNewGroupName.focus();
        setStatus("先给分组起个名字");
        return;
      }
      try {
        const created = await api("POST", "library/groups", { name });
        closeNewGroupRow();
        await loadStickerLibrary();
        if (created?.group?.id) pickStickerGroup(created.group.id);
      } catch (error) {
        setStatus(`分组没建成：${error.message}`);
      }
    }

    /** 删图分两步：先变「再点」，再点才真删——不留神点错还有个刹车。 */
    async function armOrRemoveSticker(stickerId) {
      if (armedStickerId !== stickerId) {
        armedStickerId = stickerId;
        renderStickerRows();
        return;
      }
      armedStickerId = "";
      try {
        await api("DELETE", `library/stickers/${encodeURIComponent(stickerId)}`);
        stickerCache.delete(`own\u0000${String(current)}\u0000${stickerId}`);
        await loadStickerLibrary();
        setStatus("已从图库删掉；以前发出去的那条还留着");
      } catch (error) {
        setStatus(`删不掉：${error.message}`);
        renderStickerRows();
      }
    }

    /** 删分组同样两步。图不跟着删，只退回「全部」。 */
    async function armOrRemoveGroup() {
      const group = stickerGroups.find((row) => row.id === activeStickerGroup);
      if (!group) return;
      if (!armedGroupDelete) {
        armedGroupDelete = true;
        el.stickerGroupDelete.textContent = "再点一次";
        return;
      }
      armedGroupDelete = false;
      el.stickerGroupDelete.textContent = "删分组";
      try {
        await api("DELETE", `library/groups/${encodeURIComponent(group.id)}`);
        activeStickerGroup = "__all";
        await loadStickerLibrary();
        setStatus(`分组「${group.name}」删了，里面的图退回「全部」`);
      } catch (error) {
        setStatus(`分组删不掉：${error.message}`);
      }
    }

    /**
     * 添加到图库。
     *
     * 两件事必须做，都是她实机撞出来的：
     * 一是锁住按钮——取字节是一张一次宿主往返，一批几十张要等好几秒，
     *   没锁的话她会以为卡死、连点好几下，那就是重复提交；
     * 二是把数字摆出来——分趟送，每趟完就报“正在添加 x/y”，
     *   等待感是设计题，只要它在动，体感就完全不同。
     */
    async function confirmStickerImport() {
      if (importing) return;
      if (!selectedSourceIds.size) return setStatus("先选几张表情包");
      const ids = [...selectedSourceIds];
      let groupId = activeStickerGroup === "__all" ? "" : activeStickerGroup;
      const newName = el.newStickerGroup.value.trim();
      importing = true;
      el.stickerImportConfirm.disabled = true;
      el.stickerImportConfirm.textContent = "正在添加…";
      let imported = 0;
      let duplicates = 0;
      try {
        if (newName) {
          const created = await api("POST", "library/groups", { name: newName });
          groupId = created.group.id;
        }
        for (let at = 0; at < ids.length; at += IMPORT_CHUNK) {
          const slice = ids.slice(at, at + IMPORT_CHUNK);
          el.stickerImportNote.hidden = false;
          el.stickerImportNote.textContent = `正在添加 ${Math.min(at + slice.length, ids.length)}/${ids.length}…`;
          const result = await api("POST", "library/import", { sourceIds: slice, groupId });
          imported += result?.imported ?? 0;
          duplicates += result?.duplicates ?? 0;
        }
        el.stickerImportNote.hidden = true;
        el.newStickerGroup.value = "";
        selectedSourceIds.clear();
        el.stickerImport.hidden = true;
        el.stickerPicker.hidden = false;
        await loadStickerLibrary();
        if (groupId) pickStickerGroup(groupId);
        setStatus(
          duplicates
            ? `图库里多了 ${imported} 张（${duplicates} 张本来就有，直接并进分组了）`
            : `图库里多了 ${imported} 张`,
        );
      } catch (error) {
        // 断了就留在这一页：选中的还在、按钮也解开了，再点一次接着加（重了的自己会去重）。
        el.stickerImportNote.hidden = false;
        el.stickerImportNote.textContent = `加到一半断了：${error.message}（已经加进去的还在，可以再点一次接着加）`;
        setStatus(`没加完：${error.message}`);
      } finally {
        importing = false;
        el.stickerImportConfirm.disabled = false;
        el.stickerImportConfirm.textContent = "添加到图库";
      }
    }

    function selectSticker(row) {

      renderPendingSticker();

    el.emojiButton.addEventListener("click", () => {

    /*
     * 点外面就收。聊天区、伙伴展板、发送键，点哪儿都算外面。
     * 三个得排掉：
     * 一是开抽屉那一颗（它也在外面，不排会一关一开，看着像闪了一下）；
     * 二是输入框（她只是想打字，抽屉这时候收掉像是被赶）；

    /** 把一张表情包放进来。读不到就整条撤掉，不留在那儿当破图。 */
    async function stickerBubble(row, line, stickerId) {
      const img = document.createElement("img");
      img.className = "sticker loading";
      img.alt = "表情包";
      // 插在最前面：图在前、时间在后，她那边的 row-reverse 才会把时间甩到左边去
      line.prepend(img);
      const url = await loadSticker(stickerId);
      if (!url || !img.isConnected) {
        row.remove();

      }
