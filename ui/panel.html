      img.classList.remove("loading");
    }

    /**
     * 把一个头像容器（里面有 .ph 占位字和 .im 图）填上真图。
     *
     * 聊天窗头部那个容器从头到尾就一个节点、谁来都往上填，所以每一笔都先记下
     * 这次是替谁要的图：图回来的时候要是已经换成别人了（或者这位根本没有头像），
     * 就把上一张摘干净、露出首字 —— 不然换站到没头像的伙伴身上，会一直挂着上一位的脸。
     */
    async function paintAvatar(box, agentId, fallbackText) {
      if (!box) return;
      const ph = box.querySelector(".ph");
      const im = box.querySelector(".im");
      if (ph) ph.textContent = (fallbackText || "?").slice(0, 1);
      const want = String(agentId ?? "");
      box.dataset.avatarWant = want;
      const url = await loadAvatar(agentId);
      if (!im || !box.isConnected || box.dataset.avatarWant !== want) return;
      if (url) {
        im.src = url;
        im.hidden = false;
        if (ph) ph.hidden = true;
        return;
      }
      im.hidden = true;
      im.removeAttribute("src");
      if (ph) ph.hidden = false;
    }

    /**
     * 卡里的请求必须带 App 票据。用 SDK 的 hana.api.fetch，
     * 它会把 iframe URL 上的 appSurfaceSession 放进请求头；
     * 直接用裸 fetch 会被宿主判 403。
     */
    async function api(method, sub, body, { timeoutMs = 30000 } = {}) {
      const path = String(sub).replace(/^\//, "");
      const init = { method };
      if (body) {
        init.headers = { "content-type": "application/json" };
        init.body = JSON.stringify(body);
      }
      // 卡住不能一直转：等太久就把话说清楚（原话还在输入框里，可以重试）。
      let timer = null;
      const res = await Promise.race([
        hana.api.fetch(path, init),
        new Promise((_, reject) => {
          timer = setTimeout(() => reject(new Error("等得太久了，没能连上。原话还在输入框里，待会儿再试一次。")), timeoutMs);
        }),
      ]).finally(() => {
        if (timer) clearTimeout(timer);
      });
      const text = await res.text();
      let data;
      try { data = JSON.parse(text); } catch { data = { ok: false, raw: text.slice(0, 300) }; }
      if (!res.ok || data.ok === false) {
        throw new Error(data?.error?.message || data?.raw || `HTTP ${res.status}`);
      }
      return data;
    }

    function setStatus(text) {
      clearTimeout(statusTimer);
      const next = String(text || "");
      el.status.textContent = next;
      if (!next) return;
      statusTimer = setTimeout(() => {
        el.status.textContent = "";
        statusTimer = null;
      }, 3200);
    }
    let autoScrollAllowed = true;
    const SCROLL_BOTTOM_GAP = 24;

    function isAtBottom() {
      return el.stream.scrollHeight - el.stream.scrollTop - el.stream.clientHeight <= SCROLL_BOTTOM_GAP;
    }

    function updateJumpBottom() {
      const shouldShow = el.stream.scrollHeight > el.stream.clientHeight && !isAtBottom();
      el.jumpBottom.hidden = !shouldShow;
    }

    function scrollDown(force = false) {
      if (!force && !autoScrollAllowed) {
        updateJumpBottom();
        return;
      }
      el.stream.scrollTop = el.stream.scrollHeight;
      updateJumpBottom();
    }

    el.stream.addEventListener("scroll", () => {
      autoScrollAllowed = isAtBottom();
      updateJumpBottom();
    }, { passive: true });
    el.jumpBottom.addEventListener("click", () => {
      autoScrollAllowed = true;
      scrollDown(true);
    });

    /**
     * 输入框跟着内容长：空着就一行，写多了自己长高。
     * 上限交给 CSS 的 max-height —— 这里只报自然高，封顶以后就是框里滚，不把输入区抻大。
     */
    function autosizeInput() {
      el.input.classList.toggle("is-multiline", el.input.value.includes("\n"));
      el.input.style.height = "0px";
      el.input.style.height = `${el.input.scrollHeight}px`;
    }

    /**
     * 消息旁边那个头像框。
     * 底色和首字常驻，图加载好了盖上去 —— 所以就算没头像、或图还没到，
     * 排版的宽度也是稳的，不会一抽一抽地跳。
     */
    function messageAvatar(agentId, fallbackText) {
      const box = document.createElement("span");
      box.className = "msg-av";
      const ph = document.createElement("span");
      ph.className = "ph";
      const im = document.createElement("img");
      im.className = "im";
      im.alt = "";
      im.hidden = true;
      box.append(ph, im);
      void paintAvatar(box, agentId, fallbackText);
      return box;
    }

    /** 这条消息是谁发的头像（她自己的走 __user，伙伴的走ta的 id）。 */
    function avatarFor(role) {
      if (role === "user") return messageAvatar("__user", "我");
      const p = partners.find((x) => x.id === current);
      const box = messageAvatar(current, p?.name || "?");
      box.classList.add("poke-target");
      box.title = "双击戳一下";
      box.addEventListener("dblclick", () => void doAction(current));
      return box;
    }

    /** 发送时间：今天只报钟点，昨天加个「昨天」，再早把日期带上。 */
    function bubbleTimeText(at) {
      const d = new Date(at ?? "");
      if (Number.isNaN(d.getTime())) return "";
      const clock = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      const now = new Date();
      const sameDay = (a, b) =>
        a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
      if (sameDay(d, now)) return clock;
      if (sameDay(d, new Date(now.getTime() - 86400000))) return `昨天 ${clock}`;
      const date = `${d.getMonth() + 1} 月 ${d.getDate()} 日`;
      return d.getFullYear() === now.getFullYear() ? `${date} ${clock}` : `${d.getFullYear()} 年 ${date} ${clock}`;
    }

    /** 聊天流里的时间刻度：只在明显隔了一阵时出现。 */
    function timeDividerText(at) {
      const d = new Date(at ?? "");
      if (Number.isNaN(d.getTime())) return "";
      const now = new Date();
      const sameDay = (a, b) =>
        a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
      const clock = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
      if (sameDay(d, now)) return `今天 ${clock}`;
      if (sameDay(d, new Date(now.getTime() - 86400000))) return `昨天 ${clock}`;
      const date = `${d.getMonth() + 1} 月 ${d.getDate()} 日`;
      return d.getFullYear() === now.getFullYear() ? `${date} ${clock}` : `${d.getFullYear()} 年 ${date} ${clock}`;
    }

    function timeDivider(at) {
      const text = timeDividerText(at);
      if (!text) return null;
      const node = document.createElement("div");
      node.className = "time-divider";
      node.textContent = text;
      return node;
    }

    /** 发送时间：普通小字，跟在气泡外侧，鼠标停在那一行上才浮现。 */
    function messageTime(at) {
      const span = document.createElement("span");
      span.className = "msg-time";
      span.textContent = bubbleTimeText(at);
      if (!span.textContent) span.hidden = true;
      return span;
    }

    let lastRenderedConversationAt = null;

    function bubble(role, text, anchor = null, at = null) {
      el.emptyTip?.remove();
      const parsedAt = Date.parse(at ?? "");
      if (Number.isFinite(parsedAt) && lastRenderedConversationAt !== null
        && parsedAt - lastRenderedConversationAt >= TIME_DIVIDER_GAP_MS) {
        const divider = timeDivider(at);
        if (divider) place(divider, anchor);
      }
      const row = document.createElement("div");
      row.className = `row ${role === "user" ? "me" : "ta"}`;
      if (showMessageAvatars) row.appendChild(avatarFor(role));
      const col = document.createElement("div");
      col.className = "msg-col";
      // 气泡和时间并排站一层：时间贴着气泡外侧，底下那行「已读」不掺和它的对齐
      const line = document.createElement("div");
      line.className = "msg-line";
      const time = messageTime(at);
      const stickerId = stickerIdOf(text);
      if (stickerId) {
        line.append(time);
        col.appendChild(line);
        row.appendChild(col);
        place(row, anchor);
        if (Number.isFinite(parsedAt)) lastRenderedConversationAt = parsedAt;
        scrollDown();
        void stickerBubble(row, line, stickerId);
        return { row, col, bubble: col };
      }
      const b = document.createElement("div");
      b.className = "bubble";
      b.textContent = text;
      line.append(b, time);
      col.appendChild(line);
      row.appendChild(col);
      place(row, anchor);
      if (Number.isFinite(parsedAt)) lastRenderedConversationAt = parsedAt;
      scrollDown();
      return { row, col, bubble: b };
    }

    /** 这条该放哪儿：末尾还站着那个「正在输入」的话，就插在它前面。 */
    function place(row, anchor) {
      if (anchor?.isConnected) el.stream.insertBefore(row, anchor);
      else el.stream.appendChild(row);
    }

    /** 未读小字。挂在气泡那一列里，不跟着头像跑；读到后就收起。 */
    function tick(parent, text = "未读") {
      const t = document.createElement("div");
      t.className = "tick";
      t.textContent = text;
      parent.appendChild(t);
      return t;
    }

    /** 已画过的未读小字也要跟着后端状态走，读到后收起。 */
    const tickNodes = new Map();

    function paintTick(node, read) {
      if (!node) return;
      if (read) {
        node.remove();
        return;
      }
      node.textContent = "未读";
    }

    /* 消息操作条：平时藏着，鼠标悬停在消息上才从这条气泡旁边浮出来。 */
    const messageActions = document.createElement("div");
    messageActions.className = "msg-actions";
    messageActions.hidden = true;
    document.body.appendChild(messageActions);
    let actionRow = null;
    let actionMessage = null;
    let actionCloseTimer = null;
    const ACTION_BAR_GAP = 8;
    const ACTION_BAR_MARGIN = 8;

    function scheduleCloseActions() {
      clearTimeout(actionCloseTimer);
      actionCloseTimer = setTimeout(() => closeMessageActions(), 100);
    }
    function keepActions() { clearTimeout(actionCloseTimer); }
    function closeMessageActions() {
      messageActions.hidden = true;
      actionRow?.classList.remove("actions-open");
      actionRow = null;
      actionMessage = null;
    }
    function placeMessageActions(row) {
      const anchor = row.querySelector(".bubble") || row;
      const rect = anchor.getBoundingClientRect();
      const box = messageActions.getBoundingClientRect();
      const mine = row.classList.contains("me");
      const left = Math.max(ACTION_BAR_MARGIN, Math.min(mine ? rect.right - box.width : rect.left, window.innerWidth - box.width - ACTION_BAR_MARGIN));
      let top = rect.top - box.height - ACTION_BAR_GAP;
      const below = top < ACTION_BAR_MARGIN;
      if (below) top = rect.bottom + ACTION_BAR_GAP;
      messageActions.classList.toggle("below", below);
      messageActions.style.left = `${Math.round(left)}px`;
      messageActions.style.top = `${Math.round(Math.max(ACTION_BAR_MARGIN, Math.min(top, window.innerHeight - box.height - ACTION_BAR_MARGIN)))}px`;
    }
    function actionButton(title, label, icon, handler) {
      const button = document.createElement("button");
      button.type = "button";
      button.title = title;
      button.innerHTML = `${icon}<span>${label}</span>`;
      button.addEventListener("click", handler);
      return button;
    }
    async function reloadCurrentThread(agentId = current, viewSeq = threadViewSeq) {
      if (!agentId || current !== agentId || viewSeq !== threadViewSeq) return false;
      const data = await api("GET", `thread/${encodeURIComponent(agentId)}`);
      if (current !== agentId || viewSeq !== threadViewSeq) return false;
      currentMessages = data.messages || [];
      renderAll(currentMessages);
      return true;
    }
    async function recallMessage(agentId, messageId, viewSeq = threadViewSeq) {
      closeMessageActions();
      try {
        await api("POST", `thread/${encodeURIComponent(agentId)}/retract/${encodeURIComponent(messageId)}`);
        await reloadCurrentThread(agentId, viewSeq);
        await loadPartners();
        if (current === agentId && viewSeq === threadViewSeq) setStatus("消息撤回了");
      } catch (error) { if (current === agentId && viewSeq === threadViewSeq) setStatus(error.message || "这条消息现在不能撤回"); }
    }
    async function regenerateMessage(agentId, messageId, viewSeq = threadViewSeq) {
      closeMessageActions();
      setStatus("正在换一种说法…");
      try {
        await api("POST", `thread/${encodeURIComponent(agentId)}/refine/${encodeURIComponent(messageId)}/regenerate`);
        await reloadCurrentThread(agentId, viewSeq);
        if (current === agentId && viewSeq === threadViewSeq) setStatus("这条回复换好了");
      } catch (error) { if (current === agentId && viewSeq === threadViewSeq) setStatus(error.message || "这次没生成出新的回复"); }
    }
    function openMessageEditor(message, agentId = current, viewSeq = threadViewSeq) {
      closeMessageActions();
      const layer = document.createElement("div");
      layer.className = "message-editor-layer";
      layer.innerHTML = '<div class="message-editor" role="dialog" aria-modal="true" aria-label="调整伙伴回复"><div class="message-editor-head"><b>调整这条回复</b><button type="button" class="message-editor-close" aria-label="关闭">×</button></div><textarea maxlength="4000"></textarea><div class="message-editor-foot"><button type="button" class="message-editor-save">采用这版回复</button></div></div>';
      const textarea = layer.querySelector("textarea");
      textarea.value = message.text || "";
      const close = () => layer.remove();
      layer.querySelector(".message-editor-close").addEventListener("click", close);
      layer.addEventListener("click", (event) => { if (event.target === layer) close(); });
      layer.querySelector(".message-editor-save").addEventListener("click", async (event) => {
        const button = event.currentTarget;
        const text = textarea.value.trim();
        if (!text) { setStatus("回复不能改成空白"); return; }
        button.disabled = true;
        button.textContent = "正在保存…";
        try {
          await api("POST", `thread/${encodeURIComponent(agentId)}/refine/${encodeURIComponent(message.id)}/edit`, { text });
          close();
          await reloadCurrentThread(agentId, viewSeq);
          if (current === agentId && viewSeq === threadViewSeq) setStatus("这条回复换好了");
        } catch (error) { button.disabled = false; button.textContent = "采用这版回复"; setStatus(error.message || "没保存上"); }
      });
      document.body.appendChild(layer);
      textarea.focus();
      textarea.select();
    }
    function isLatestAssistantMessage(message, agentId = current) {
      if (!message?.id || !agentId) return false;
      const latest = [...currentMessages].reverse().find((row) => row?.role === "assistant" && !row.recalled);
      return latest?.id === message.id;
    }
    function isLatestUserMessage(message, agentId = current) {
      if (!message?.id || !agentId) return false;
      const latest = [...currentMessages].reverse().find((row) => row?.role === "user" && !row.recalled);
      return latest?.id === message.id;
    }

    function openMessageActions(row, message, agentId = current) {
      if (!row || !message?.id || !agentId) return;
      const viewSeq = threadViewSeq;
      keepActions();
      if (actionRow === row && !messageActions.hidden) return;
      closeMessageActions();
      messageActions.replaceChildren();
      const icon = {
        back: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
        refresh: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-4L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14 4l2-2"/><path d="M20 20v-5h-5"/></svg>',
        edit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 16-.7 4.7L8 20l11-11-4-4L4 16Z"/><path d="m13 6 4 4"/></svg>',
      };
      if (message.role === "user") {
        messageActions.appendChild(actionButton("撤回这条消息", "撤回消息", icon.back, () => void recallMessage(agentId, message.id, viewSeq)));
      } else if (messageRefineEnabled && isLatestAssistantMessage(message, agentId)) {
        messageActions.append(
          actionButton("重新生成这条回复", "重新生成", icon.refresh, () => void regenerateMessage(agentId, message.id, viewSeq)),
          actionButton("调整这条回复", "编辑", icon.edit, () => openMessageEditor(message, agentId, viewSeq)),
        );
      } else return;
      actionRow = row;
      actionMessage = message;
      row.classList.add("actions-open");
      messageActions.hidden = false;
      messageActions.style.left = "-9999px";
      placeMessageActions(row);
    }
    function bindMessageActions(row, message, agentId = current) {
      if (!row || !message?.id || !agentId || row.dataset.actionsBound === "1") return;
      row.dataset.actionsBound = "1";
      row.addEventListener("pointerenter", () => openMessageActions(row, message, agentId));
      row.addEventListener("pointerleave", scheduleCloseActions);
    }
    messageActions.addEventListener("pointerenter", keepActions);
    messageActions.addEventListener("pointerleave", scheduleCloseActions);
    document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeMessageActions(); });
    el.stream.addEventListener("scroll", closeMessageActions, { passive: true });
    window.addEventListener("resize", closeMessageActions);

    function typingIndicator() {
      const row = document.createElement("div");
      row.className = "row ta";
      if (showMessageAvatars) row.appendChild(avatarFor("assistant"));
      const box = document.createElement("div");
      box.className = "typing";
      box.innerHTML = "<i></i><i></i><i></i>";
      row.appendChild(box);
      el.stream.appendChild(row);
      scrollDown();
      return row;
    }

    /**
     * 面对面时把回复「演」出来，而不是等轮询把整条一次画上去。
     *
     * 后端已经算好节奏递过来：`readAfterMs` 是 ta 多久看到这条，`items[].gapMs` 是
     * 每条气泡之间隔多久（短句快、长句慢，对数式）。这里只负责按那个时间表摆出来——
     * 未读 → 已读 → 正在输入 → 一条条蹦。这套是茶话会的核心手感，不能只剩轮询兜底。
     *
     * 她中途切走、或者这轮后端本来就没给回合（手机不在手，只排队），就什么都不做，
     * 交给轮询补画；绝不在别人的窗口里乱塞气泡。
     */
    const liveSkipRepliedTo = new Set();
    async function playLiveTurn(agentId, viewSeq, started, tickEl) {
      const repliedTo = started.messageId;
      const alive = () => current === agentId && viewSeq === threadViewSeq;
      liveSkipRepliedTo.add(repliedTo);
      let dots = null;
      try {
        await sleep(Math.max(300, Number(started.readAfterMs) || 0));
        if (!alive()) return;
        // 已读：小字收起，跟后端那套「读过就不占聊天流」同一条规矩
        tickEl?.remove();
        dots = typingIndicator();
        let payload = null;
        for (let i = 0; i < 240; i += 1) {
          const state = await api("GET", `turns/${encodeURIComponent(started.turnId)}`);
          if (!alive()) return;
          if (state.status === "ready") { payload = state; break; }
          if (state.status === "error") break;
          await sleep(500);
        }
        if (!payload) return;
        for (const item of payload.items || []) {
          await sleep(Math.max(120, Number(item.gapMs) || 700));
          if (!alive()) return;
          bubble("assistant", item.text, null, new Date().toISOString());
          // 三个点始终站在最新那条下面，不能跑到新消息头上去
          el.stream.appendChild(dots);
        }
        // 这条已经在这儿演完了；记一笔，下一轮轮询别再把整条重画一遍
        if (payload.replyMessageId) seenIds.add(payload.replyMessageId);
      } catch {
        /* 演出失败就当没演：轮询下一轮会把整条补上 */
      } finally {
        dots?.remove();
        liveSkipRepliedTo.delete(repliedTo);
      }
    }

    /** 小动作只留一条居中的淡字，回戳也统一双击伙伴头像。 */
    function renderAction(m) {
      el.emptyTip?.remove();
      const row = document.createElement("div");
      row.className = "poke-row";
      const line = document.createElement("span");
      line.className = "poke-line";
      const emoji = actionEmoji.get(m.actionId);
      line.textContent = emoji ? `${emoji} ${m.text}` : m.text;
      row.appendChild(line);
      el.stream.appendChild(row);
      scrollDown();
    }

    /**
     * 哪些自己的话已经落到盘上成「已读」了。
     *
     * 两种算数：① ta真看到过了（存了 readAt，后端落盘，刷新也在）；
     * ② 老记录没有 readAt 但后面确实出现过ta的话——回都回了，肯定看过了。
     * 两个都不占就是未读，照实摆出「未读」两个字。
     */
    function readUserIds(list) {
      const out = new Set();
      let sawAssistant = false;
      for (let i = list.length - 1; i >= 0; i -= 1) {
        const m = list[i];
        if (!m) continue;
        if (m.role === "assistant") sawAssistant = true;
        else if (m.role === "user" && (m.readAt || sawAssistant)) out.add(m.id);
      }
      return out;
    }

    const TIME_DIVIDER_GAP_MS = 10 * 60 * 1000;

    /** 画一条消息（历史与增量都走这里） */
    function renderMessage(m, opts = {}) {
      if (!m || (seenIds.has(m.id) && !opts.allowSeen)) return false;
      if (!seenIds.has(m.id)) seenIds.add(m.id);
      if (m.kind === "poke" || m.kind === "action") {
        renderAction(m);
      } else if (m.role === "user") {
        if (m.recalled) {
          const recalled = bubble("user", m.text || "你撤回了一条消息", null, m.at);
          recalled.bubble.classList.add("recalled-bubble");
          return true;
        }
        let col;
        let row;
        if (m.kind === "sticker" && Array.isArray(m.bubbles) && m.bubbles.length) {
          let lastBubble = null;
          for (const piece of m.bubbles) {
            const rendered = bubble("user", piece, null, m.at);
            row = rendered.row;
            col = rendered.col;
            lastBubble = rendered.bubble;
          }
          if (m.attachment?.id && lastBubble) {
            const imageNode = document.createElement("img");
            imageNode.className = "message-image";
            imageNode.alt = m.attachment.name || "发送的图片";
            imageNode.loading = "lazy";
            lastBubble.appendChild(document.createElement("br"));
            lastBubble.appendChild(imageNode);
            mountAttachmentImage(imageNode, m.attachment.id, current, Boolean(opts.keepBottom));
          }
        } else {
          const regular = bubble("user", m.text, null, m.at);
          if (m.attachment?.id) {
            const imageNode = document.createElement("img");
            imageNode.className = "message-image";
            imageNode.alt = m.attachment.name || "发送的图片";
            imageNode.loading = "lazy";
            regular.bubble.appendChild(document.createElement("br"));
            regular.bubble.appendChild(imageNode);
            mountAttachmentImage(imageNode, m.attachment.id, current, Boolean(opts.keepBottom));
          }
          row = regular.row;
          col = regular.col;
        }
        // 只把真正需要注意的未读摆出来；已读不占聊天流的位置。
        const read = Boolean(opts.read);
        if (!read) tickNodes.set(m.id, tick(col));
        if (isLatestUserMessage(m)) bindMessageActions(row, m);
      } else {
        const rawList = Array.isArray(opts.assistantPieces)
          ? opts.assistantPieces
          : (Array.isArray(m.bubbles) && m.bubbles.length ? m.bubbles : [m.text]);
        // 光杆 [表情] 不渲染（老消息清不掉，屏幕上也别再看到它）；整条只剩它时才退回原文
        const filtered = rawList.filter((piece) => !isBareStickerMarker(piece));
        const list = filtered.length ? filtered : rawList;
        let lastRow = null;
        for (const piece of list) lastRow = bubble("assistant", piece, null, m.at).row;
        if (lastRow && opts.bindAssistantActions !== false
          && (m.role !== "assistant" || isLatestAssistantMessage(m))) bindMessageActions(lastRow, m);
      }
      return true;
    }

    function invalidateRendering() {
      renderGeneration += 1;
      liveDots?.remove();
      liveDots = null;
    }

    /** 整段重画（改了外观开关之后用）。 */
    function renderAll(list) {
      const previousAutoScroll = autoScrollAllowed;
      autoScrollAllowed = true;
      try {
        invalidateRendering();
        el.stream.innerHTML = "";
        seenIds = new Set();
        lastRenderedConversationAt = null;
        tickNodes.clear();
        if (!list.length) {
          const tip = document.createElement("div");
          tip.className = "empty";
          const p = partners.find((x) => x.id === current);
          tip.textContent = `跟${p?.name || "他"}没什么正经事，随便扯吧`;
          el.stream.appendChild(tip);
        } else {
          const read = readUserIds(list);
          for (const m of list) renderMessage(m, { read: read.has(m.id), keepBottom: true });
          scrollDown(true);
        }
        paintedWithAvatars = showMessageAvatars;
      } finally {
        autoScrollAllowed = previousAutoScroll;
        updateJumpBottom();
      }
    }

    /** 把线上已有的消息 id 都记成「画过了」，不重画。
     *  实时那条路是自己一条条蹦出来的，不经过 seenIds；补这一下免得下一轮轮询又画一遍。
     */
    async function markAllSeen(agentId, viewSeq = threadViewSeq) {
      try {
        const data = await api("GET", `thread/${agentId}`);
        if (current !== agentId || viewSeq !== threadViewSeq) return;
        currentMessages = data.messages || [];
        for (const m of currentMessages) if (m?.id) seenIds.add(m.id);
      } catch { /* 记不上就下一轮轮询自己会处理 */ }
    }

    /** 把线上新到的消息补进来（已画的跳过）；外观开关变了就整段重画 */
    const ASYNC_BUBBLE_GAP_MS = 680;
    async function appendNewOnce(agentId, viewSeq) {
      const generation = renderGeneration;
      const previousAutoScroll = autoScrollAllowed;
      const stickToBottom = isAtBottom();
      const restoreScroll = (value) => {
        autoScrollAllowed = previousAutoScroll;
        updateJumpBottom();
        return value;
      };
      const data = await api("GET", `thread/${agentId}`);
      if (current !== agentId || viewSeq !== threadViewSeq || generation !== renderGeneration) return restoreScroll(0);
      currentMessages = data.messages || [];
      autoScrollAllowed = stickToBottom;
      if (paintedWithAvatars !== showMessageAvatars) {
        renderAll(currentMessages);
        return restoreScroll(Math.max(1, currentMessages.length));
      }
      let added = 0;
      const read = readUserIds(currentMessages);
      for (const m of currentMessages) {
        if (current !== agentId || viewSeq !== threadViewSeq || generation !== renderGeneration) return restoreScroll(added);
        // 正在「演」的那一轮由 playLiveTurn 一条条摆出来，轮询别抢着把整条先画上
        if (m?.role === "assistant" && m.repliedTo && liveSkipRepliedTo.has(m.repliedTo)) continue;
        if (m?.role === "assistant" && Array.isArray(m.bubbles) && m.bubbles.length > 1 && !seenIds.has(m.id)) {
          for (let index = 0; index < m.bubbles.length; index += 1) {
            if (current !== agentId || viewSeq !== threadViewSeq || generation !== renderGeneration) return restoreScroll(added);
            renderMessage(m, {
              allowSeen: index > 0,
              assistantPieces: [m.bubbles[index]],
              bindAssistantActions: index === m.bubbles.length - 1,
            });
            if (index < m.bubbles.length - 1) await sleep(ASYNC_BUBBLE_GAP_MS);
          }
          added += 1;
        } else if (renderMessage(m, { read: read.has(m.id) })) {
          added += 1;
        }
      }
      // 已经挂在屏幕上的未读小字也要跟着新状态走
      for (const m of currentMessages) paintTick(tickNodes.get(m.id), read.has(m.id));
      return restoreScroll(added);
    }
    function appendNew(agentId) {
      const viewSeq = threadViewSeq;
      const run = appendNewQueue.then(() => appendNewOnce(agentId, viewSeq));
      appendNewQueue = run.catch(() => 0);
      return run;
    }

    /**
     * 戳一下：只把她那一下放上去。
     *
     * 不摆「正在回复」的姿态——ta接不接、几时接，都是她看不到的事；
     * 秒回一个戳也假，所以回不回的时机在后头。
     */
    async function doAction(agentId) {
      if (!agentId || busy) return;
      busy = true;
      try {
        const sent = await api("POST", `action/${agentId}`);
        await appendNew(agentId);
        await loadPartners();
      } catch (error) {
        setStatus(`没做成：${error.message}`);
      } finally {
        busy = false;
      }
    }


    // 未读数来自同一轮 partners 轮询；聊天入口已经能直接打开并阅读消息，恢复视觉提醒。
    const SHOW_UNREAD_BADGES = true;

    function renderFriends() {
      el.friends.innerHTML = "";
      for (const p of partners) {
        const li = document.createElement("li");
        li.className = `friend${current === p.id ? " active" : ""}`;
        li.innerHTML = `
          <div class="avatar"><span class="ph"></span><img class="im" alt="" hidden></div>
          <div class="who">
            <div class="name"></div>
            <div class="hint"></div>
          </div>
          <span class="badge" hidden></span>`;
        li.querySelector(".name").textContent = p.name;
        void paintAvatar(li.querySelector(".avatar"), p.id, p.name);
        // 名字下面只放最后一句：没聊过的伙伴就空着，不拿人格设定当占位
        const preview = String(p.lastMessage?.text ?? "").replace(/\s+/g, " ").trim();
        li.querySelector(".hint").textContent = preview;
        const badge = li.querySelector(".badge");
        const unread = Number(p.unread ?? 0);
        if (SHOW_UNREAD_BADGES && unread > 0) {
          badge.hidden = false;
          badge.textContent = unread > 99 ? "99+" : String(unread);
        }
        li.setAttribute("role", "button");
        li.tabIndex = 0;
        li.setAttribute("aria-label", `${p.name}${badge.hidden ? "" : `，${badge.textContent} 条没看`}`);
        const openThis = () => openPartner(p.id);
        li.addEventListener("click", openThis);
        li.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openThis();
          }
        });
        el.friends.appendChild(li);
      }
    }

    function showNoPartner() {
      threadViewSeq += 1;
      closeMessageActions();
      current = null;
      currentMessages = [];
      seenIds = new Set();
      el.title.textContent = "选一位伙伴";
      el.chatAvatar.hidden = true;
      el.input.disabled = true;
      el.send.disabled = true;
      el.imageButton.disabled = true;
      el.emojiButton.disabled = true;
      el.appearanceButton.disabled = true;
      closeEmojiDrawer();
      closeAppearance();
      el.stream.innerHTML = '<div class="empty" id="empty-tip">左边点一位伙伴，就能开始聊了<span class="empty-hint">还没有伙伴？点右上角齿轮，去『伙伴管理』建一个茶话会角色</span></div>';
      el.emptyTip = document.getElementById("empty-tip");
      clearChatBackground();
    }

    async function loadPartners() {
      const loadSeq = ++partnersLoadSeq;
      const data = await api("GET", "partners");
      if (loadSeq !== partnersLoadSeq) return;
      partners = data.partners || [];
      lastPartnerId = data.lastPartnerId || null;
      // 外观开关跟着轮询走：她在设置里改完，最迟一轮就生效
      showMessageAvatars = Boolean(data.messageAvatars);
      messageRefineEnabled = Boolean(data.messageRefine);
      actionEmoji = new Map((data.actionStyles ?? []).map((style) => [style.id, style.emoji]));
      // 账本读到坏文件时后端会把坏的挪走留档，这里告诉她一声，别让数据静默消失
      if (data.dataWarning) {
        setStatus(`有一份数据读到损坏，已经挪走留档（${data.dataWarning.file}），这次按空的算了。`);
      }
      const total = data.totalUnread ?? 0;
      el.subtitle.textContent = total > 0 ? `${total} 条没看` : `${partners.length} 位伙伴`;
      // 展板收起时也保留提醒，避免消息到了却完全没有入口提示。
      if (el.railDot) el.railDot.hidden = !(total > 0);
      const currentWasRemoved = current && !partners.some((partner) => partner.id === current);
      renderFriends();
      // 她在设置页换了图或者换了浓度，这儿最迟一轮跟上。
      // 列表回包可能比当前聊天线程旧；缺背景时不能拿旧 null 清掉刚铺好的房间。
      if (current) {
        const currentPartner = partners.find((p) => p.id === current);
        if (currentPartner?.background) void syncChatBackground(current, currentPartner.background);
        el.imageButton.disabled = !(currentPartner?.imageCapability?.allowed);
        el.imageButton.title = currentPartner?.imageCapability?.allowed ? "发送图片" : "当前伙伴没有通过测试的识图模型";
      }
      if (currentWasRemoved) {
        const next = partners[0]?.id;
        if (next) await openPartner(next);
        else showNoPartner();
      }
    }

    /** 取数轮询不等于人在看；在场只由聚焦页面的心跳续上。 */
    let presenceTimer = null;
    let presenceActive = false;
    let presenceBound = false;
    let presenceSeq = 0;
    const presenceToken = globalThis.crypto?.randomUUID?.() || `panel-${Date.now()}-${Math.random().toString(36).slice(2)}`;

    function postPresence(active) {
      const seq = presenceSeq++;
      void api("POST", "presence", { active, token: presenceToken, seq }).catch(() => {});
    }

    function stopPresence() {
      if (presenceTimer) clearInterval(presenceTimer);
      presenceTimer = null;
      if (!presenceActive) return;
      presenceActive = false;
      postPresence(false);
    }

    function syncPresence() {
      const active = document.visibilityState === "visible" && document.hasFocus();
      if (!active) {
        stopPresence();
        return;
      }
      // 盯回窗口这一刻，画在眼前的就算看到了（轮询没焦点时补画过的那些，到这儿补上）
      reportRead();
      if (presenceActive) return;
      presenceActive = true;
      postPresence(true);
      presenceTimer = setInterval(() => {
        if (document.visibilityState !== "visible" || !document.hasFocus()) {
          stopPresence();
          return;
        }
        postPresence(true);
      }, 20000);
    }

    function bindPresence() {
      if (presenceBound) return;
      presenceBound = true;
      window.addEventListener("focus", syncPresence);
      window.addEventListener("blur", stopPresence);
      window.addEventListener("pagehide", stopPresence);
      document.addEventListener("visibilitychange", syncPresence);
      syncPresence();
    }

    /**
     * 她真的看过才算已读。
     *
     * 以前是「拉一次记录就盖章」，可轮询也在走那条路：窗口开着、人跑去忙别的，
     * 消息照样被标成已读，伙伴就拿着假收据来问「你咋不回我」。
     * 现在只有页面可见、窗口有焦点、消息确实画在她眼前时才上报。
     */
    let lastReportedReadId = null;
    function reportRead(agentId = current) {
      if (!agentId || agentId !== current) return;
      if (document.visibilityState !== "visible" || !document.hasFocus()) return;
      const last = currentMessages[currentMessages.length - 1];
      if (!last?.id || last.id === lastReportedReadId) return;
      lastReportedReadId = last.id;
      api("POST", `thread/${encodeURIComponent(agentId)}/read`, { throughId: last.id }).catch(() => {});
    }

    /** 隔一阵看一眼有没有人来消息（未读徒标就靠它）。 */
    let pollTimer = null;
    function startPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(async () => {
        if (document.visibilityState !== "visible") return;
        try {
          await loadPartners();
          if (current) await appendNew(current);
          reportRead();
        } catch { /* 轮询失败不吵她 */ }
      }, 5000);
    }

    /**
     * 聊天窗的背景。图从后端现拉（带票据走 blob），每位伙伴一张。
     *
     * 铺在整个聊天窗上，不是只铺中间那条滚动带：上头尾两条工具栏是半透明的玻璃，
     * 透出来的是同一张图，三块板拼起来的那道缝才消得掉。
     * 气泡是实心的，所以图只在缝隙里露出来；看不清字的风险由那层暖白遮罩兜。
     * 同一个人同一张图只更浓度，不重拉一遍。
     */
    let chatBgUrl = null;
    let chatBgFor = null;
    let chatBgStamp = null;
    let sendButtonAdaptSeq = 0;
    let chatBackgroundSyncSeq = 0;
    let appearanceLoadSeq = 0;

    function clearChatBackground() {
      if (chatBgUrl) { URL.revokeObjectURL(chatBgUrl); chatBgUrl = null; }
      chatBgFor = null;
      chatBgStamp = null;
      ++sendButtonAdaptSeq;
      el.send.style.removeProperty("--send-bg");
      el.send.style.removeProperty("--send-fg");
      el.send.style.removeProperty("--send-border");
      el.chat.style.removeProperty("--status-bg");
      el.chat.style.removeProperty("--status-fg");
      el.chat.style.removeProperty("--status-border");
      el.chat.style.removeProperty("--bubble-me-bg");
      el.chat.style.removeProperty("--bubble-me-border");
      el.chat.style.removeProperty("--bubble-ta-bg");
      el.chat.style.removeProperty("--bubble-ta-border");
      el.chat.style.removeProperty("--bubble-me-fg");
      el.chat.style.removeProperty("--bubble-ta-fg");
      el.chat.style.removeProperty("--mc-veil");
      el.chat.style.removeProperty("background-image");
      el.chat.style.removeProperty("background-size");
      el.chat.style.removeProperty("background-position");
      el.chat.style.removeProperty("background-repeat");
      el.chat.classList.remove("has-bg");
    }

    async function adaptSendButtonColor(url) {
      const seq = ++sendButtonAdaptSeq;
      const theme = buttonThemeFromSample(await analyzeBackgroundUrl(url));
      if (seq !== sendButtonAdaptSeq || chatBgUrl !== url) return;
      if (!theme) return;
      el.send.style.setProperty("--send-bg", theme.background);
      el.send.style.setProperty("--send-fg", theme.foreground);
      el.send.style.setProperty("--send-border", theme.border);
      el.chat.style.setProperty("--status-bg", theme.noticeBackground);
      el.chat.style.setProperty("--status-fg", theme.noticeForeground);
      el.chat.style.setProperty("--status-border", theme.noticeBorder);
      el.chat.style.setProperty("--bubble-me-bg", theme.bubbleMeBackground);
      el.chat.style.setProperty("--bubble-me-border", theme.bubbleMeBorder);
      el.chat.style.setProperty("--bubble-ta-bg", theme.bubbleTaBackground);
      el.chat.style.setProperty("--bubble-ta-border", theme.bubbleTaBorder);
      el.chat.style.setProperty("--bubble-me-fg", theme.bubbleMeForeground);
      el.chat.style.setProperty("--bubble-ta-fg", theme.bubbleTaForeground);
    }

    function paintChatBackground(opacity, url) {
      const veil = Math.max(0, Math.min(100, Number(opacity))) / 100;
      el.chat.style.setProperty("background-image", `linear-gradient(rgba(247, 244, 236, ${veil}), rgba(247, 244, 236, ${veil})), url("${url}")`);
      el.chat.style.setProperty("background-size", "cover");
      el.chat.style.setProperty("background-position", "center");
      el.chat.style.setProperty("background-repeat", "no-repeat");
      // 头尾那两条磨砂玻璃跟着同一个浓度走：她调暗背景，条子也一起变白
      el.chat.style.setProperty("--mc-veil", String(veil));
    }

    function closeAppearance() {
      appearanceLoadSeq += 1;
      appearanceBackground = null;
      el.appearancePopover.hidden = true;
      for (const url of appearanceGalleryUrls) URL.revokeObjectURL(url);
      appearanceGalleryUrls = [];
    }

    async function loadAppearance(agentId = current) {
      if (!agentId) return;
      const loadSeq = ++appearanceLoadSeq;
      try {
        const data = await api("GET", `backgrounds/${encodeURIComponent(agentId)}`);
        if (loadSeq !== appearanceLoadSeq || current !== agentId) return;
        const currentBg = data.current ?? partners.find((p) => p.id === agentId)?.background ?? null;
        appearanceBackground = currentBg;
        const opacity = Number.isFinite(Number(currentBg?.opacity)) ? Number(currentBg.opacity) : 52;
        el.appearanceOpacity.value = String(opacity);
        el.appearanceOpacityValue.textContent = `${opacity}%`;
        el.appearanceClear.hidden = !currentBg;
        el.appearanceGallery.replaceChildren();
        for (const url of appearanceGalleryUrls) URL.revokeObjectURL(url);
        appearanceGalleryUrls = [];
        for (const item of data.backgrounds ?? []) {
          const tile = document.createElement("div");
          tile.className = "appearance-tile";
          const button = document.createElement("button");
          button.type = "button";
          button.className = "appearance-thumb";
          button.classList.toggle("on", item.file === currentBg?.file);
          const image = document.createElement("img"); image.alt = ""; button.appendChild(image);
          button.title = item.file === currentBg?.file ? "当前背景" : "使用这张背景";
          button.addEventListener("click", async () => {
            button.disabled = true;
            try {
              const saved = await api("POST", `background/${encodeURIComponent(agentId)}`, { file: item.file, opacity: Number(el.appearanceOpacity.value) });
              if (current !== agentId || loadSeq !== appearanceLoadSeq) return;
              appearanceBackground = saved.background;
              await syncChatBackground(agentId, appearanceBackground);
              await loadAppearance(agentId);
            } catch (error) { setStatus(`背景没换成：${error.message}`); } finally { button.disabled = false; }
          });
          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "appearance-remove";
          remove.textContent = "删";
          remove.title = "从背景图库删除这张图";
          remove.addEventListener("click", async (event) => {
            event.stopPropagation();
            if (armedBackgroundFile !== item.file) {
              armedBackgroundFile = item.file;
              remove.textContent = "再删";
              setStatus("再点一次，才会从背景图库里删除这张图");
              clearTimeout(armedBackgroundTimer);
              armedBackgroundTimer = setTimeout(() => { armedBackgroundFile = ""; remove.textContent = "删"; }, 3000);
              return;
            }
            remove.disabled = true;
            try {
              await api("DELETE", `background/${encodeURIComponent(agentId)}?file=${encodeURIComponent(item.file)}&remove=1`);
              if (current !== agentId || loadSeq !== appearanceLoadSeq) return;
              if (currentBg?.file === item.file) await syncChatBackground(agentId, null);
              await loadAppearance(agentId);
              setStatus("背景图删掉了");
            } catch (error) { setStatus(`背景图删不掉：${error.message}`); }
            finally { remove.disabled = false; }
          });
          tile.append(button, remove);
          el.appearanceGallery.appendChild(tile);
          void hana.api.fetch(`background/${encodeURIComponent(agentId)}?file=${encodeURIComponent(item.file)}&v=${encodeURIComponent(item.at ?? "")}`).then((res) => res.ok ? res.blob() : null).then((blob) => {
            if (!blob?.size || !button.isConnected || loadSeq !== appearanceLoadSeq || current !== agentId) return;
            const url = URL.createObjectURL(blob);
            if (loadSeq !== appearanceLoadSeq || current !== agentId) { URL.revokeObjectURL(url); return; }
            appearanceGalleryUrls.push(url); image.src = url;
          }).catch(() => {});
        }
        if (loadSeq !== appearanceLoadSeq || current !== agentId) return;
        await paintAppearancePreview(agentId, currentBg);
      } catch (error) {
        if (loadSeq === appearanceLoadSeq && current === agentId) setStatus(`背景图库没读出来：${error.message}`);
      }
    }

    async function paintAppearancePreview(agentId, background) {
      if (!background?.file) {
        el.appearancePreview.style.removeProperty("background-image");
        el.appearancePreview.classList.remove("has-bg");
        return;
      }
      try {
        const res = await hana.api.fetch(`background/${encodeURIComponent(agentId)}?file=${encodeURIComponent(background.file)}&v=${encodeURIComponent(background.at ?? "")}`);
        const blob = await res.blob();
        if (!blob.size || current !== agentId) return;
        const url = URL.createObjectURL(blob);
        const opacity = Number(el.appearanceOpacity.value);
        el.appearancePreview.style.backgroundImage = `linear-gradient(rgba(247,244,236,${opacity / 100}), rgba(247,244,236,${opacity / 100})), url("${url}")`;
        el.appearancePreview.classList.add("has-bg");
        el.appearancePreview.dataset.previewUrl = url;
      } catch { /* 预览取不到时保留空状态 */ }
    }

    async function openAppearance() {
      if (!current) return;
      el.appearancePopover.hidden = false;
      await loadAppearance(current);
    }

    window.__chahuahuiHana = hana;
    function closeSettingsView() {
      el.settingsView.hidden = true;
      el.settingsFrame.src = "about:blank";
    }
    function openSettingsView() {
      el.settingsFrame.src = `settings.html?embedded=1&t=${Date.now()}`;
      el.settingsView.hidden = false;
    }
    window.addEventListener("message", (event) => {
      if (event.source !== el.settingsFrame.contentWindow) return;
      if (event.data?.type === "chahuahui:close-settings") {
        closeSettingsView();
        return;
      }
      if (event.data?.type !== "chahuahui:open-panel-action") return;
      const action = event.data.action;
      const value = String(event.data.value ?? "").trim();
      if (action === "reshape") {
        const partner = partners.find((row) => row.id === value);
        if (!partner) return;
        closeSettingsView();
        current = null;
        renderFriends();
        void obStartRecognition(partner, { restart: true });
        return;
      }
      if (action === "recognize") {
        const partner = partners.find((row) => row.id === value);
        if (!partner) return;
        closeSettingsView();
        current = null;
        renderFriends();
        void obPick(partner);
        return;
      }
      if (action === "create") {
        closeSettingsView();
        obState = { ...emptyObState(), mode: "local-create" };
        obOpen();
        obRender();
        startPolling();
        bindPresence();
      }
    });
    el.settingsButton.addEventListener("click", openSettingsView);
    el.appearanceButton.addEventListener("click", () => void openAppearance());
    el.appearanceClose.addEventListener("click", closeAppearance);
    el.appearancePick.addEventListener("click", () => el.appearanceFile.click());
    el.appearanceFile.addEventListener("change", async () => {
      const file = el.appearanceFile.files?.[0];
      el.appearanceFile.value = "";
      if (!file || !current) return;
      if (file.size > 12 * 1024 * 1024) return setStatus("这张图太大了，换一张小一点的（上限 12MB）");
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const saved = await api("POST", `background/${encodeURIComponent(current)}`, { base64: String(reader.result).split(",")[1] ?? "", opacity: Number(el.appearanceOpacity.value) });
          appearanceBackground = saved.background;
          await syncChatBackground(current, appearanceBackground);
          await loadAppearance(current);
          setStatus("背景换好了");
        } catch (error) { setStatus(`背景没换成：${error.message}`); }
      };
      reader.readAsDataURL(file);
    });
    el.appearanceClear.addEventListener("click", async () => {
      if (!current) return;
      try { await api("DELETE", `background/${encodeURIComponent(current)}`); await syncChatBackground(current, null); await loadAppearance(current); setStatus("已清除当前背景"); }
      catch (error) { setStatus(`背景没清掉：${error.message}`); }
    });
    el.appearanceOpacity.addEventListener("input", () => {
      if (!appearanceBackground || !current) return;
      const opacity = Number(el.appearanceOpacity.value);
      el.appearanceOpacityValue.textContent = `${opacity}%`;
      void paintAppearancePreview(current, appearanceBackground);
      clearTimeout(appearanceOpacityTimer);
      appearanceOpacityTimer = setTimeout(async () => {
        try { const data = await api("POST", `background/${encodeURIComponent(current)}`, { opacity }); appearanceBackground = data.background; await syncChatBackground(current, appearanceBackground); }
        catch (error) { setStatus(`明暗没存上：${error.message}`); }
      }, 180);
    });

    async function syncChatBackground(agentId, background) {
      if (!background?.file) {
        ++chatBackgroundSyncSeq;
        if (chatBgFor !== null || chatBgUrl) clearChatBackground();
        return;
      }
      const tone = background.tone || "medium";
      const stamp = background.at ?? "";
      // 还是这间房、还是那张图：只有图已经下载好时才复用；下载中的重复同步不能短路掉唯一请求。
      if (chatBgFor === agentId && chatBgStamp === stamp && chatBgUrl) {
        paintChatBackground(background.opacity ?? ({ light: 34, medium: 52, heavy: 76 }[tone] ?? 52), chatBgUrl);
        return;
      }
      const syncSeq = ++chatBackgroundSyncSeq;
      clearChatBackground();
      chatBgFor = agentId;
      chatBgStamp = stamp;
      el.chat.classList.add("has-bg");
      try {
        const res = await hana.api.fetch(`background/${encodeURIComponent(agentId)}?file=${encodeURIComponent(background.file)}&v=${encodeURIComponent(stamp)}`);
        if (!res.ok) throw new Error("no background");
        const blob = await res.blob();
        if (!blob.size) throw new Error("empty");
        // 回来时可能已经换人、换图了，别把上一位的房间贴到这一位身上
        if (syncSeq !== chatBackgroundSyncSeq || chatBgFor !== agentId || chatBgStamp !== stamp) return;
        chatBgUrl = URL.createObjectURL(blob);
        adaptSendButtonColor(chatBgUrl);
        // 直接铺在聊天窗本身。用内联 background-image，不赌伪元素背景层——
        // webview 对那种画法不稳，这个坑踩过。
        paintChatBackground(background.opacity ?? ({ light: 34, medium: 52, heavy: 76 }[tone] ?? 52), chatBgUrl);
      } catch (error) {
        // 旧房间的失败回包不能碰新房间的背景和提示。
        if (syncSeq !== chatBackgroundSyncSeq || chatBgFor !== agentId || chatBgStamp !== stamp) return;
        el.chat.classList.remove("has-bg");
        setStatus(`背景没铺上：${error?.message || error}`);
      }
    }

    function rememberComposerDraft() {
      if (!inputOwner || !el.input.value.trim()) return;
      pendingDrafts.set(inputOwner, { text: el.input.value.trim(), revision: inputRevision });
    }

    async function openPartner(agentId) {
      // 点当前伙伴只收起列表，不重拉线程、不清输入框，也不打断正在进行的回复。
      if (current === agentId) {
        foldAfterPick();
        return;
      }
      rememberComposerDraft();
      inputOwner = agentId;
      inputRevision += 1;
      el.input.value = "";
      autosizeInput();
      const openSeq = ++openPartnerSeq;
      ++threadViewSeq;
      ++imageChoiceSeq;
      closeMessageActions();
      // 还没完成初步认识的伙伴进不了聊天窗，先一起聊一遍。故意拦的：性格得自己过一道手。
      if (obPending?.has(agentId)) {
        const target = partners.find((p) => p.id === agentId) ?? { id: agentId, name: agentId };
        current = null;
        renderFriends();
        foldAfterPick();
        void obPick(target);
        return;
      }
      current = agentId;
      renderFriends();
      foldAfterPick();
      const partner = partners.find((p) => p.id === agentId);
      el.title.textContent = partner?.name || agentId;
      el.chatAvatar.hidden = false;
      void paintAvatar(el.chatAvatar, agentId, partner?.name || agentId);
      el.input.disabled = false;
      el.send.disabled = false;
      el.imageButton.disabled = !(partner?.imageCapability?.allowed);
      el.imageButton.title = partner?.imageCapability?.allowed ? "发送图片" : "当前伙伴没有通过测试的识图模型";
      el.emojiButton.disabled = false;
      el.appearanceButton.disabled = false;
      closeAppearance();
      clearPendingImage();
      clearPendingSticker();
      stickerRows = [];
      stickerGroups = [];
      activeStickerGroup = "__all";
      emojiPage = "emoji";
      sourceRows = [];
      sourceAvailable = false;
      sourceReason = "";
      sourceHiddenUntagged = 0;
      stickerLoadedFor = null;
      manageMode = false;
      armedStickerId = "";
      armedGroupDelete = false;
      renderStickerTabs();
      closeEmojiDrawer();
      setStatus("");
      el.stream.innerHTML = "";
      clearChatBackground(); // 新的人进来，先把上一位的房间收走
      seenIds = new Set();
      try {
        const data = await api("GET", `thread/${agentId}`);
        if (openSeq !== openPartnerSeq) return;
        currentMessages = data.messages || [];
        renderAll(currentMessages);
        const draft = pendingDrafts.get(agentId);
        if (draft && inputOwner === agentId) {
          el.input.value = draft.text;
          autosizeInput();
          setStatus("刚才那条没送出去，已经替你留着了");
        }
        // 这间房的背景：拿这会儿的数据先铺一次，不等轮询那一轮
        void syncChatBackground(agentId, data.pref?.background ?? null);
        // 她真的看着这个窗：这一刻画到哪儿就算读到哪儿（不再拿「拉过一次」当看过）
        reportRead(agentId);
        // 徒标跟着刷新
        await loadPartners();
      } catch (error) {
        if (openSeq === openPartnerSeq) setStatus(`打开失败：${error.message}`);
      }
    }

    function readImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result ?? ""));
        reader.onerror = () => reject(new Error("图片没读出来"));
        reader.readAsDataURL(file);
      });
    }

    function renderPendingImage() {
      const image = pendingImage;
      if (!image?.data) {
        el.pendingImage.hidden = true;
        el.pendingImageThumb.removeAttribute("src");
        return;
      }
      el.pendingImageThumb.src = image.data;
      el.pendingImageThumb.alt = image.name || "待发送图片";
      el.pendingImageState.textContent = `准备发给 ${partners.find((partner) => partner.id === current)?.name || "ta"}`;
      el.pendingImageName.textContent = image.name || "图片";

    function renderPendingSticker() {

      if (!sticker?.id) {
        el.pendingSticker.hidden = true;
        el.pendingStickerThumb.removeAttribute("src");
        return;
      }
      el.pendingStickerState.textContent = `准备发给 ${partners.find((partner) => partner.id === current)?.name || "ta"}`;
      el.pendingStickerName.textContent = sticker.name || "表情包";
      el.pendingSticker.hidden = false;
      el.pendingStickerThumb.removeAttribute("src");
      void loadStickerImage(sticker.id, { agentId: current }).then((url) => {

    function clearPendingSticker() {

    function clearPendingImage() {

      pendingImage = null;
      el.imageFile.value = "";
